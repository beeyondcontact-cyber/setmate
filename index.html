const plGet=id=>(S.pls||[]).find(p=>p.id===id);
function plFind(dz){for(const p of S.pls||[]){const x=p.items.find(y=>y.dz===dz)||(p.sim||[]).find(y=>y.dz===dz);if(x)return x;}return (S.radio||[]).find(y=>y.dz===dz)||null;}
const dzItemA=t=>Object.assign(dzItem(t),{aid:t.artist?t.artist.id:null});
function splitRow(l,sep){if(sep==="\t")return l.split("\t");const r=[];let cur="",q=false;
  for(let i=0;i<l.length;i++){const c=l[i];if(q){if(c==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}else if(c==='"')q=true;else if(c===sep){r.push(cur);cur="";}else cur+=c;}r.push(cur);return r;}
/** Lit une liste de sons, quel que soit son format : M3U, tableau (export Musique, Exportify, TuneMyMusic), ou une ligne « Artiste - Titre » par son. */
function parseList(text){const lines=String(text||"").replace(/^﻿/,"").split(/\r\n|\r|\n/).map(l=>l.trim()).filter(Boolean);
  const out=[],seen=new Set(),push=(t,a)=>{t=String(t||"").trim();a=String(a||"").trim();if(!t)return;const k=norm(a+" "+t);if(seen.has(k))return;seen.add(k);out.push({t,a});};
  if(!lines.length)return out;const head=lines[0].toLowerCase();
  if(head.startsWith("#extm3u")||lines.some(l=>/^#EXTINF/i.test(l))){let inf=null;
    for(const l of lines){if(/^#EXTINF/i.test(l)){inf=l.replace(/^#EXTINF:[^,]*,/i,"");continue;}if(l.startsWith("#"))continue;const m=parseName(inf||l.split(/[\\/]/).pop());push(m.t,m.a);inf=null;}return out;}
  const sep=head.includes("\t")?"\t":/(track|titre|title|name|nom)/.test(head)&&head.includes(",")?",":/(track|titre|title|name|nom)/.test(head)&&head.includes(";")?";":null;
  if(sep){const rows=lines.map(l=>splitRow(l,sep)),h=rows[0].map(c=>c.toLowerCase().trim());
    const ti=h.findIndex(c=>/^(name|nom|titre|title|track name|track|song|morceau)$/.test(c)),ai=h.findIndex(c=>/^(artist|artiste|artist name\(s\)|artist name|artists|artistes|interprète)$/.test(c));
    if(ti>=0){rows.slice(1).forEach(r=>push(r[ti],ai>=0?String(r[ai]||"").split(/;|\|/)[0]:""));return out;}
    if(sep==="\t"){rows.forEach(r=>{const d=r.findIndex(c=>/^\d{1,2}:\d{2}(:\d{2})?$/.test(c.trim()));push(r[0],d>=0?r[d+1]:r[1]);});return out;}}
  for(const l of lines){if(/^https?:\/\//i.test(l))continue;const s=l.replace(/^\s*\d{1,3}\s*[.)-]\s+/,""),m=s.split(/\s+[-–—]\s+/);
    if(m.length>1)push(m.slice(1).join(" - "),m[0]);else{const b=s.split(/\s+(?:by|par|·)\s+/i);b.length>1?push(b[0],b[1]):push(s,"");}}
  return out;}
/** Retrouve un son sur Deezer à partir de son titre et de son artiste ; essaie aussi l’ordre inverse. */
async function dzMatch(x,swapped=false){const art=String(x.a||"").split(/,|&| feat| ft\.| x /i)[0].trim(),tit=String(x.t||"").replace(/\(.*?\)|\[.*?\]/g,"").trim();
  if(!tit)return null;let best=null,bs=0;
  try{const d=await jsonp("https://api.deezer.com/search?q="+encodeURIComponent((art+" "+tit).trim())+"&limit=8");const T0=norm(tit).trim(),A0=norm(art).trim();
    for(const it of d.data||[]){const tt=norm(it.title_short||it.title).trim(),aa=norm(it.artist&&it.artist.name).trim();let s=0;
      if(tt===T0)s+=3;else if(tt&&(tt.includes(T0)||T0.includes(tt)))s+=2;else if(tt.includes(T0.split(" ")[0]))s+=1;
      if(A0){if(aa===A0)s+=3;else if(aa&&(aa.includes(A0.split(" ")[0])||A0.includes(aa)))s+=2;}else s+=1;
      if(s>bs){bs=s;best=it;}}
    if(best&&bs>=(A0?4:3))return dzItemA(best);}catch(e){return null;}
  return !swapped&&x.a?dzMatch({t:x.a,a:x.t},true):null;}

function plFromModal(){const url=$("#plUrl").value.trim(),txt=$("#plTxt").value,name=$("#plName").value.trim();
  if(url){if(/spotify\.com|music\.apple\.com/i.test(url))return toast("Ce lien ne se lit pas sans compte développeur. Ouvre l’aide « Ma playlist est sur Apple Music ou Spotify ».",false,true);

    if(!m)return toast(/link\.deezer|page\.link|dzr\.page/i.test(url)?"Lien court : ouvre-le une fois, puis copie le lien complet (avec /playlist/).":"Lien Deezer non reconnu.",false,true);
    closeModal();return plFromDeezer(m[1],name);}
  if(txt.trim()){const items=parseList(txt);if(!items.length)return toast("Aucun son reconnu dans cette liste.",false,true);closeModal();return plFromItems(items,name||"Ma playlist","texte");}

function plFromFile(){const i=$("#fileIn");i.accept=".txt,.csv,.tsv,.m3u,.m3u8";i.onchange=async()=>{const f=i.files[0];i.value="";if(!f)return;
  const b=new Uint8Array(await f.arrayBuffer()),enc=b[0]===0xFF&&b[1]===0xFE?"utf-16le":b[0]===0xFE&&b[1]===0xFF?"utf-16be":b.length>1&&b[1]===0&&b[3]===0?"utf-16le":"utf-8";
  const items=parseList(new TextDecoder(enc).decode(b)),name=(($("#plName")||{}).value||"").trim()||f.name.replace(/\.[^.]+$/,"");
  closeModal();if(!items.length)return toast("Aucun son reconnu dans ce fichier.",false,true);plFromItems(items,name,"fichier");};i.click();}
async function plFromDeezer(id,name){toast("J’importe la playlist Deezer…");
  try{const d=await jsonp(`https://api.deezer.com/playlist/${id}`);const items=((d.tracks&&d.tracks.data)||[]).map(dzItemA);let idx=items.length;
    while(idx<Math.min(d.nb_tracks||0,1000)){const r=await jsonp(`https://api.deezer.com/playlist/${id}/tracks?index=${idx}&limit=100`);const a=(r.data||[]).map(dzItemA);if(!a.length)break;items.push(...a);idx+=a.length;}
    plCreate(name||d.title||"Playlist Deezer","deezer",items.filter(x=>x.dz),d.picture_medium);}catch(e){toast("Import impossible : "+esc(e.message),false,true);}}
function plFromItems(items,name,src){plCreate(name,src,items,null);}
function plCreate(name,src,items,cv){const p={id:"p"+Date.now().toString(36),name,src,date:Date.now(),items,cover:cv||null};S.pls.unshift(p);save();
  S.lsTab="pls";S.plOpen=p.id;S.plLimit=200;go("listen");if(p.items.some(x=>!x.dz))plMatch(p);else toast(`Playlist « ${esc(name)} » importée : ${pl(items.length,"son")}.`);}
let plBusy=null;
async function plMatch(p){const todo=p.items.filter(x=>!x.dz&&!x.miss);if(!todo.length)return;plBusy={id:p.id,done:0,total:todo.length};softListen();let k=0;
  // 3 recherches en parallèle, espacées : Deezer limite le nombre de requêtes par seconde
  const worker=async()=>{while(k<todo.length){const x=todo[k++];const r=await dzMatch(x);if(r)Object.assign(x,{dz:r.dz,cover:r.cover,pop:r.pop,aid:r.aid,dzT:r.t,dzA:r.a});else x.miss=true;
    plBusy.done++;if(plBusy.done%6===0)softListen();await sleep(250);}};
  await Promise.all([worker(),worker(),worker()]);plBusy=null;
  // deux lignes qui désignent le même son (ordre inversé, orthographe) n’en font plus qu’une
  const sd=new Set(),n0=p.items.length;p.items=p.items.filter(x=>!x.dz||(sd.has(x.dz)?false:sd.add(x.dz)));const dup=n0-p.items.length;save();softListen();const miss=todo.filter(x=>x.miss).length;
  toast(`« ${esc(p.name)} » prête : ${pl(todo.length-miss,"son")} trouvé${todo.length-miss>1?"s":""}${miss?`, ${miss} introuvable${miss>1?"s":""}`:""}${dup?`, ${dup} doublon${dup>1?"s":""} fusionné${dup>1?"s":""}`:""}.`,false,false,"lib");}

function plQueueItem(x){const o=ownMatch(x);if(o)return {fid:o.fid,t:o.t,a:o.a};const m=libMatch(x);if(m&&!m.wish)return {n:m.n,t:m.t,a:m.a,cover:m.cover};
  return x.dz?{dz:x.dz,t:x.t,a:x.a,cover:x.cover}:null;}

const plSimBusy=new Set();
/** Sons du même univers que la playlist : radios Deezer de ses artistes principaux, peu connus d’abord. */
async function plSimilar(id){const p=plGet(id);if(!p||plSimBusy.has(id))return;plSimBusy.add(id);softListen();
  try{const cnt={};p.items.forEach(x=>{const a=norm(String(x.dzA||x.a).split(/,|&| feat/i)[0]).trim();if(a)cnt[a]=(cnt[a]||0)+1;});
    const arts=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>e[0]),have=new Set(p.items.map(x=>x.dz).filter(Boolean)),seen=new Set(),res=[];
    for(const a of arts){try{const x=p.items.find(y=>y.aid&&norm(y.dzA||y.a).includes(" "+a.split(" ")[0]+" "));let aid=x&&x.aid;
      if(!aid){const s=await jsonp("https://api.deezer.com/search/artist?q="+encodeURIComponent(a)+"&limit=1");aid=s.data&&s.data[0]&&s.data[0].id;}
      if(!aid)continue;const r=await jsonp(`https://api.deezer.com/artist/${aid}/radio?limit=15`);
      for(const t of r.data||[]){const it=dzItemA(t);if(!t.preview||have.has(it.dz)||seen.has(it.dz)||libMatch(it))continue;seen.add(it.dz);it.peu=it.pop<PEU_CONNU;res.push(it);}}
      catch(e){/* un artiste sans radio Deezer ne bloque pas les autres */}
      await sleep(150);}
    if(!res.length)throw new Error("rien de nouveau trouvé");p.sim=shuffle(res).sort((a,b)=>(b.peu?1:0)-(a.peu?1:0)).slice(0,30);analyzeQueue(p.sim);}
  catch(e){toast("Suggestions impossibles : "+esc(e.message),false,true);}
  plSimBusy.delete(id);save();softListen();}

    if(dz){const d=await jsonp(`https://api.deezer.com/track/${dz}`);aid=d.artist&&d.artist.id;}
    if(!aid&&x.a){const s=await jsonp("https://api.deezer.com/search/artist?q="+encodeURIComponent(String(x.a).split(/,|&| feat/i)[0])+"&limit=1");aid=s.data&&s.data[0]&&s.data[0].id;}
    if(!aid)throw new Error("artiste introuvable");const r=await jsonp(`https://api.deezer.com/artist/${aid}/radio?limit=40`);

/* ---------- Enchaînement sans coupure : le son suivant est prêt AVANT la fin du son en cours ---------- */
const DZP={};let QPRE=null;
async function dzPreview(dz){const c=DZP[dz];if(c&&Date.now()-c.t<8*60e3)return c.u;const d=await jsonp(`https://api.deezer.com/track/${dz}`);
  if(!d.preview)throw new Error("pas d’extrait");DZP[dz]={u:d.preview,t:Date.now()};return d.preview;}
/** Indice du son suivant, sans rien lancer. En aléatoire, le choix est gardé pour que le son préparé soit bien celui qui jouera. */
function qPeek(auto){const n=Q.items.length;if(!n)return -1;if(auto&&Q.repeat==="one")return Q.i;
  if(Q.shuffle&&n>1){if(Q.nextI!=null&&Q.nextI!==Q.i&&Q.nextI<n&&!Q.played.has(Q.nextI))return Q.nextI;
    let left=Q.items.map((_,j)=>j).filter(j=>!Q.played.has(j));
    if(!left.length){if(auto&&Q.repeat!=="all")return -1;Q.played=new Set([Q.i]);left=Q.items.map((_,j)=>j).filter(j=>j!==Q.i);}
    return (Q.nextI=left[Math.floor(Math.random()*left.length)]);}
  let i=Q.i+1;if(i>=n){if(auto&&Q.repeat!=="all")return -1;i=0;}return i;}
function qNext(auto=false){const i=qPeek(auto);if(i<0)return stopPlay();qPlay(i);}
async function qPrefetch(){const i=qPeek(true);if(i<0||i===Q.i)return;const it=Q.items[i],key=qKey(it);if(QPRE&&QPRE.i===i&&QPRE.k===key)return;
  try{let url,x,src;const tr=it.n&&T(it.n);
    if(it.fid){const b=await DB.get("file_"+it.fid);if(!b)return;url=URL.createObjectURL(b);x={t:it.t,a:it.a};src="sur ce téléphone";}
    else if(it.dz||(tr&&tr.wish&&tr.dz)){const dz=it.dz||tr.dz;url=await dzPreview(dz);x=tr?tr:{dz,t:it.t,a:it.a,cover:it.cover};src="extrait 30 s · Deezer";}
    else return;
    if(QPRE&&QPRE.url&&QPRE.url.startsWith("blob:"))URL.revokeObjectURL(QPRE.url);
    QPRE={i,k:key,url,x,src};ev("prêt",x.t);}catch(e){ev("prépa-ko",e.message);}}
AU.addEventListener("playing",()=>{if(inQueue())qPrefetch();});
/** Fin d’un son de la file : on remplace la source et on relance tout de suite, sans repasser par l’arrêt ni par Internet. */
function qAdvance(){const i=qPeek(true);if(i<0)return stopPlay();const it=Q.items[i],pre=QPRE;
  if(i===Q.i){AU.currentTime=0;AU.play().catch(()=>qPlay(i));return;}
  if(pre&&pre.i===i&&pre.k===qKey(it)&&pre.url){const old=AU.src;Q.i=i;Q.nextI=null;Q.played.add(i);Q.fails=0;PL={u:qKey(it),x:pre.x,src:pre.src};QPRE=null;
    if(old&&old.startsWith("blob:")&&old!==pre.url)URL.revokeObjectURL(old);AU.src=pre.url;const pr=AU.play();mediaSync();
    pr.then(()=>{ev("enchaîné",pre.x.t);startProg();renderPlayer();refreshPlay();},e=>{ev("enchaîné-ko",e.message);qPlay(i);});return;}
  ev("pas prêt → chargement normal");qPlay(i);}
AU.onended=()=>{ev("fin du son");if(inQueue())qAdvance();else stopPlay();};
function previewFail(){if(Q.items.length&&Q.fails<3)toast("Pas d’extrait pour ce son, je passe au suivant.");else toast("Extrait indisponible.",false,true);}

/* ---------- Partager (menu Partager de l’iPhone : AirDrop, WhatsApp, Notes, Fichiers…) ---------- */
async function shareOut({title,text,file,name,type}){
  try{if(file&&navigator.canShare){const f=new File([file],name,{type:type||file.type||"text/plain"});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title});return "partage";}}
    if(!file&&navigator.share){await navigator.share({title,text});return "partage";}}
  catch(e){if(e&&e.name==="AbortError")return false;logErr("partage",e.message);}
  if(text&&navigator.clipboard){try{await navigator.clipboard.writeText(text);toast("Copié : colle-le où tu veux.");return "copie";}catch(e){}}
  if(file){download(file,name);toast("Fichier téléchargé (le menu Partager n’est pas disponible ici).");return "fichier";}return false;}

  const ok=await shareOut({title:"Sauvegarde SetMate",file:new Blob([JSON.stringify({setmate:VERSION,date:Date.now(),state:st})],{type:"application/json"}),name,type:"application/json"});

function listActions(kind,label){return `<div class="row mt" style="gap:8px;flex-wrap:wrap"><button class="btn ghost sm" onclick="saveList('${kind}')">${svg("plplus",14)}Enregistrer en playlist</button><button class="btn ghost sm" onclick="shareKind('${kind}')">${svg("share",14)}Partager</button></div>`;}
function listOf(kind){const on=new Set(STYLES.filter(([k])=>S.styles[k]).map(x=>x[1]));
  if(kind==="search")return [`Recherche « ${S.search.q} »`,S.search.items||[]];
  if(kind==="moment")return [`Tendances du ${new Date(S.trends.date||Date.now()).toLocaleDateString("fr-FR")}`,S.trends.items||[]];
  if(kind==="disc")return [`Pépites du ${new Date().toLocaleDateString("fr-FR")}`,(S.disc.items||[]).filter(x=>on.has(x.style))];
  if(kind==="liste")return ["À récupérer",wishes()];

  if(kind==="queue")return [Q.label||"File d’écoute",Q.items.map(qLabel)];
  if(kind.startsWith("gig:")){const g=S.gigs.find(x=>String(x.id)===kind.slice(4));return [g?`${g.lieu} · ${fmtDate(g.date)}`:"Soirée",g?g.played.map(T).filter(Boolean):[]];}
  if(kind.startsWith("pl:")){const p=plGet(kind.slice(3));return [p?p.name:"Playlist",p?p.items:[]];}
  return ["Liste",[]];}

const _vTrend=VIEWS.trend;
/** Enregistrer / partager : juste sous les onglets (ou sous la barre de recherche), là où le doigt les trouve sans défiler. */

async function restoreState(d){if(!(await confirmRestore(d)))return false;const cur=S.own||[],keep=S.undo;Object.assign(S,d.state);S.undo=keep;
  const all=[...cur,...(S.own||[])],seen=new Set(),ok=[];
  for(const o of all){if(seen.has(o.fid))continue;seen.add(o.fid);if(await DB.get("file_"+o.fid))ok.push(o);}
  const lost=all.filter((o,i)=>all.findIndex(x=>x.fid===o.fid)===i).length-ok.length;S.own=ok;S.pls=S.pls||[];reindex();save(true);render();
  toast(lost>0?`Données restaurées. ${pl(lost,"fichier")} audio de la sauvegarde ne sont pas sur ce téléphone : à rajouter.`:"Données restaurées.");return true;}

/* ===================== 1.7 Liens avec Apple Music et Spotify, sans compte développeur =====================
   - Retrouver un son dans Apple Music (API gratuite iTunes Search) : ouvrir dans Musique, lecteur Apple intégré.
   - Envoyer une playlist vers Apple Music par un raccourci iPhone (presse-papiers + shortcuts://).
   - Importer son historique et ses playlists depuis les fichiers d'export officiels d'Apple et de Spotify.
   Rien n'est envoyé à un serveur : les fichiers sont lus sur l'appareil. */
Object.assign(IC,{apple:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',hist:'<path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>'});
S.am=S.am||{};
const AMC="fr";

/* ---------- Retrouver un son dans Apple Music ---------- */
const amKey=x=>norm((x.a||"")+" "+(x.t||"")).trim();
let amLast=0,amChain=Promise.resolve();
function amScore(x,it){const T0=norm(baseTitle(x.t)).trim(),tt=norm(baseTitle(it.trackName)).trim(),A0=norm(String(x.a||"").split(/,|&| feat/i)[0]).trim(),aa=norm(it.artistName).trim();let s=0;
  if(tt===T0)s+=3;else if(tt&&(tt.includes(T0)||T0.includes(tt)))s+=2;else if(T0&&tt.includes(T0.split(" ")[0]))s+=1;
  if(A0){if(aa===A0||aa.includes(A0))s+=3;else if(aa&&(aa.includes(A0.split(" ")[0])||A0.includes(aa)))s+=2;}else s+=1;return s;}
/** Une recherche toutes les 3,2 s : Apple limite à environ 20 par minute. Le résultat (même « introuvable ») est gardé. */
function amMatch(x){const k=amKey(x);if(!k)return Promise.resolve(null);if(S.am[k]!==undefined)return Promise.resolve(S.am[k]);
  const run=amChain.then(async()=>{if(S.am[k]!==undefined)return S.am[k];const wait=3200-(Date.now()-amLast);if(wait>0)await sleep(wait);amLast=Date.now();
    const q=encodeURIComponent((String(x.a||"").split(/,|&| feat/i)[0]+" "+String(x.t||"").replace(/\(.*?\)|\[.*?\]/g,"")).trim());
    const r=await fetch(`https://itunes.apple.com/search?term=${q}&entity=song&limit=6&country=${AMC}`);if(!r.ok)throw new Error("Apple a répondu "+r.status+" (trop de recherches ? attends une minute)");
    const d=await r.json();let best=null,bs=0;for(const it of d.results||[]){const s=amScore(x,it);if(s>bs){bs=s;best=it;}}
    const m=best&&bs>=(x.a?4:3)?{id:best.trackId,coll:best.collectionId,url:best.trackViewUrl,t:best.trackName,a:best.artistName}:null;
    S.am[k]=m;if(Object.keys(S.am).length>600){for(const kk of Object.keys(S.am).slice(0,100))delete S.am[kk];}save();return m;});
  amChain=run.catch(()=>{});return run;}

function importHistoryFile(){const i=$("#fileIn");i.accept=".csv,.json,.txt,.tsv";i.multiple=true;

    for(const f of fs){if(f.size>80*1048576){skipped.push(f.name+" (trop lourd)");continue;}
      try{const b=new Uint8Array(await f.arrayBuffer()),enc=b[0]===0xFF&&b[1]===0xFE?"utf-16le":"utf-8",r=parseHistory(new TextDecoder(enc).decode(b),f.name);

    save();S.lsTab="pls";S.plOpen=hp?hp.id:null;go("listen");
    toast(`${top.length?pl([...plays.values()].reduce((a,b)=>a+b.n,0),"écoute")+" lues, "+pl(plays.size,"son")+" différents. ":""}${made?pl(made,"playlist")+" importée"+(made>1?"s":"")+".":""}${skipped.length?" Ignoré : "+skipped.join(", ")+".":""}`);
    if(hp){plMatch(hp);for(let k=0;k<400&&plBusy;k++)await sleep(500);if(!plSimBusy.has(hp.id))plSimilar(hp.id);}};

/** Lit un export Apple (CSV) ou Spotify (JSON). Retourne {plays:[{t,a}], playlists:[{name,items}]}. */
function parseHistory(text,name){const out={plays:[],playlists:[]},t=String(text||"").replace(/^﻿/,"").trim();if(!t)return out;
  if(t[0]==="["||t[0]==="{"){let o;try{o=JSON.parse(t);}catch(e){throw new Error("JSON illisible");}
    const arr=Array.isArray(o)?o:null;
    if(arr){for(const e of arr){if(!e||typeof e!=="object")continue;
      const tn=e.trackName||e.master_metadata_track_name,an=e.artistName||e.master_metadata_album_artist_name,ms=e.msPlayed!=null?e.msPlayed:e.ms_played;
      if(tn&&(ms==null||ms>=30000))out.plays.push({t:tn,a:an||""});}}
    const lists=o&&o.playlists;if(Array.isArray(lists))for(const p of lists){const items=[];for(const it of p.items||[]){const tr=it.track||it;const tn=tr.trackName||tr.track_name,an=tr.artistName||tr.artist_name;if(tn)items.push({t:tn,a:an||""});}
      if(items.length)out.playlists.push({name:p.name,items});}
    return out;}
  const first=t.slice(0,t.indexOf("\n")>0?t.indexOf("\n"):200),sep=first.includes("\t")?"\t":(first.split(";").length>first.split(",").length?";":",");
  const lines=t.split(/\r\n|\r|\n/).filter(Boolean),head=splitRow(lines[0],sep).map(c=>c.toLowerCase().trim());
  const col=re=>head.findIndex(c=>re.test(c)),ti=col(/^(song name|track name|trackname|title|titre|name|nom)$/),ai=col(/^(artist name|artistname|artist|artiste|album artist)$/),di=col(/^(track description)$/),du=col(/(play duration|ms played|duration milliseconds|duration)/);
  if(ti<0&&di<0){/* texte libre : seules les lignes « Artiste - Titre » comptent, un mot seul n’est pas un son */for(const x of parseList(t))if(x.a)out.plays.push(x);return out;}
  for(let i=1;i<lines.length;i++){const r=splitRow(lines[i],sep);let tt="",aa="";
    if(ti>=0){tt=(r[ti]||"").trim();aa=ai>=0?(r[ai]||"").trim():"";}else{const m=parseName(r[di]||"");tt=m.t;aa=m.a;}
    if(!tt)continue;if(du>=0){const ms=parseInt(r[du],10);if(!isNaN(ms)&&ms<30000)continue;}
    out.plays.push({t:tt,a:aa});}
  return out;}

/* ---------- Un seul compteur de requêtes Deezer pour toute l'appli (quota mesuré : ≈45 par 5 s) ---------- */
const _jsonp=jsonp;let dzStamps=[],dzBlock=0,dzNoteT=0;
async function dzGate(low){for(;;){const now=Date.now();if(now<dzBlock){await sleep(dzBlock-now+50);continue;}
  dzStamps=dzStamps.filter(t=>now-t<5000);const cap=low?22:35;   // l’analyse en arrière-plan garde de la place pour ce que tu regardes
  if(dzStamps.length<cap){dzStamps.push(now);return;}await sleep(Math.max(150,5000-(now-dzStamps[0])+30));}}
jsonp=async function(url,ms=8000,prio){if(!/api\.deezer\.com/.test(url))return _jsonp(url,ms);
  for(let a=0;;a++){await dzGate(prio==="low");
    try{return await _jsonp(url,ms);}
    catch(e){if(/quota/i.test(e.message)&&a<5){dzBlock=Date.now()+2000*Math.min(8,2**a);if(Date.now()-dzNoteT>20000){dzNoteT=Date.now();toast("Deezer demande une courte pause : je reprends tout seul.");}ev&&ev("deezer-quota","essai "+(a+1));continue;}
      throw e;}}};

function selToPl(){const it=selItems();if(!it.length)return toast("Coche d’abord des sons.");saveAsPlaylist("Sélection du "+new Date().toLocaleDateString("fr-FR"),it);}
function selAdd(){const it=selItems();if(!it.length)return toast("Coche d’abord des sons.");const added=[];for(const x of it){const {t,isNew}=addToLib(x,S.trTab==="decouverte"?"decouverte":"tendance");if(isNew)added.push(t);}
  const add=addToDefPl(added);pushUndo(`ajout de ${added.length} sons`,()=>{added.forEach(removeFromLib);const p=defPl(false);if(p)p.items=p.items.filter(y=>!add.includes(y));save(true);});
  save(true);toast(added.length?`${pl(added.length,"son")} ajouté${added.length>1?"s":""} à ta musique et à « Mes pépites ».`:"Tout est déjà dans ta musique.",!!added.length);SELD.clear();liveRefresh();}
function selBar(){if(!SELT)return `<div class="row mt2"><button class="chip" onclick="selMode(true)">☑ Sélectionner plusieurs</button></div>`;
  return `<div class="recbar"><div class="row" style="gap:8px;flex-wrap:wrap"><span class="hint" style="align-self:center">${SELD.size} coché${SELD.size>1?"s":""}</span><button class="chip" onclick="selAll()">Tout cocher</button><button class="btn sm" onclick="selAdd()">${svg("plus",14)}Ma musique + Mes pépites</button><button class="btn ghost sm" onclick="selToPl()">${svg("plplus",14)}Autre playlist</button><button class="chip on" onclick="selMode(false)">Terminé</button></div></div>`;}

/* ---------- Branchements des vues ---------- */
const _vTrend2=VIEWS.trend;
VIEWS.trend=()=>{let h=_vTrend2();const i=h.indexOf('class="seg mt"');if(i<0)return h;const j=h.indexOf("</button></div>",i)+"</button></div>".length,k=h.indexOf('<p class="hint mt">Source : Deezer');
  if(S.trTab==="liste"&&k>j)return h.slice(0,j)+recView()+h.slice(k);
  if(S.trTab==="decouverte"||S.trTab==="moment")h=h.slice(0,j)+selBar()+h.slice(j);
  if(S.trTab==="decouverte"&&Date.now()<dzBlock)h=h.replace('<p class="hint mt">Des sons','<p class="hint mt" style="color:var(--orange)">Deezer demande une courte pause, je reprends tout seul.</p><p class="hint mt">Des sons');
  return h;};
const _vHome2=VIEWS.home;
VIEWS.home=()=>{const h=_vHome2(),a=qList().length+tList().length,r=dList().length;if(!a&&!r)return h;
  return h+`<div class="grid g2 mt" style="gap:10px"><div class="card clk" onclick="S.trTab='liste';S.recTab='${qList().length?"queue":"todo"}';save();go('trend')"><div class="hint">À récupérer</div><div class="big">${a}</div><div class="hint">${qList().length} en file · ${tList().length} à obtenir</div></div>
    <div class="card clk" onclick="S.trTab='liste';S.recTab='done';save();go('trend')"><div class="hint">Récupérés</div><div class="big" style="color:var(--green)">${r}</div><div class="hint">prêts pour tes sets</div></div></div>`;};
NEWS["1.8"]=["<b>Découverte sans fin</b> : plus d’erreur quand Deezer sature, SetMate attend et reprend tout seul. La liste se prolonge quand tu descends.","<b>À récupérer en 3 étapes</b> : File d’attente, À récupérer, Récupérés. Boutons tout en haut : <b>Vider la file</b>, <b>Tout marquer récupéré</b>, sélection multiple.","<b>Le +</b> met le son dans Ma musique et dans la playlist <b>Mes pépites</b>.","<b>Sélectionner plusieurs</b> sons (Tendances, Découverte) pour les ajouter d’un coup."];

/* ===================== FENÊTRES, RECHERCHE, CLAVIER ===================== */
function modal(html){$("#layer").innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog">${html}</div></div>`;}
function closeModal(){$("#layer").innerHTML="";}
let palSel=0,palItems=[];
function openPalette(){$("#layer").innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="pal"><input id="palQ" placeholder="Un son, un artiste, une action…" oninput="palSel=0;palRender()" autocomplete="off"><div class="res" id="palR"></div></div></div>`;palRender();setTimeout(()=>{const q=$("#palQ");if(q)q.focus();},30);}
function palRender(){const q=norm($("#palQ").value).trim();
  const acts=[["Accueil",()=>go("home"),"home"],["Préparer un set",()=>go("next"),"next"],["Faire le débrief",()=>go("debrief"),"debrief"],["Tendances",()=>go("trend"),"trend"],["Écouter mes playlists",()=>go("listen"),"listen"],["Importer une playlist",()=>{go("listen");importPlaylist()},"listen"],["Actualiser les tendances",()=>{go("trend");refreshTrends();},"refresh"],["Sons à vérifier",()=>{S.libView="check";go("lib")},"lib"],["Nouvelle soirée",()=>{go("gigs");newGig()},"gigs"],["Importer un historique Serato",()=>{go("gigs");importHistory()},"dl"],["Copier le set sur clé USB",()=>{go("next");exportUsb()},"usb"],["Réglages",()=>go("settings"),"settings"]];
  palItems=[...acts.filter(a=>!q||norm(a[0]).includes(q)).map(a=>({l:esc(a[0]),f:a[1],ic:svg(a[2],16),k:"Action"})),...(q?visible().filter(x=>norm(x.t+" "+x.a+" "+x.sg).includes(q)).slice(0,8).map(x=>({l:`${esc(x.t)} <span class="hint">· ${esc(x.a)}${x.bpm?" · "+Math.round(x.bpm)+" BPM":""}</span>`,f:()=>startFrom(x.n),ic:cover(x),k:"Partir de ce son"})):[])];
  palSel=Math.min(palSel,Math.max(0,palItems.length-1));
  $("#palR").innerHTML=palItems.map((it,i)=>`<div class="it ${i===palSel?"on":""}" onmouseenter="palSel=${i};palHi()" onclick="palGo(${i})">${it.ic}<span>${it.l}</span><small>${it.k}</small></div>`).join("")||'<div class="empty">Aucun résultat</div>';}
function palHi(){[...document.querySelectorAll(".pal .it")].forEach((e,i)=>e.classList.toggle("on",i===palSel));}
function palGo(i){const it=palItems[i];$("#layer").innerHTML="";it&&it.f();}
$("#kbdHint").textContent=/Mac|iPhone|iPad/.test(navigator.platform)?"⌘ K":"Ctrl K";
document.addEventListener("keydown",e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();return;}
  if($(".pal")){if(e.key==="ArrowDown"){palSel=Math.min(palSel+1,palItems.length-1);palHi();e.preventDefault();}if(e.key==="ArrowUp"){palSel=Math.max(palSel-1,0);palHi();e.preventDefault();}if(e.key==="Enter")palGo(palSel);}
  if(e.key==="Escape"){closeModal();closeNotif();}if(typing)return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){e.preventDefault();doUndo();}
  if(e.code==="Space"&&!$(".ov")){e.preventDefault();if(PL)stopPlay();else if(S.screen==="next"&&S.cur)playTrack(S.cur);}});
window.addEventListener("focus",()=>{if(H.dl&&PERM.dl==="granted")scanDl();});

/* ===================== DÉMARRAGE ===================== */
(async()=>{await load();await loadLog();migrateStages();
  if(H.serato&&PERM.serato==="granted"&&!S.demo)await loadSerato(false);
  render();startWatch();checkNews();
  if(S.trends.date<lastThursday())await refreshTrends(true);else analyzeQueue(S.trends.items);
  if(S.tracks.length&&(!S.disc.date||Date.now()-S.disc.date>7*864e5))loadDiscovery(true);else analyzeQueue(S.disc.items||[]);
  if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(!DB.ok)toast("Stockage indisponible dans ce navigateur : tes données ne seront pas gardées après fermeture.",false,true);
})();
</script>
