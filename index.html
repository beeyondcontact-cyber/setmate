<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SetMate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="description" content="SetMate, l’assistant DJ : bibliothèque Serato, son suivant, tendances, débrief vocal.">
<title>SetMate</title>
<style>
:root{--bg:#08080a;--win:#0f0f12;--side:#0b0b0e;--panel:#151519;--panel2:#1b1b21;--panel3:#22222a;--line:#26262e;--line2:#30303a;
  --txt:#ececf1;--txt2:#b4b4c0;--muted:#7d7d8a;--blue:#2fa4ff;--orange:#ff8a1f;--green:#3ddc84;--red:#ff4d5e;--violet:#a77bff;--r:12px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#1a1d2a 0%,var(--bg) 60%);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}
nav{background:var(--side);border-right:1px solid var(--line);padding:16px 10px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:2px 10px 18px}
.logo em{font-style:normal;color:var(--blue)}
.disc{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--blue),var(--violet),var(--orange),var(--blue));display:grid;place-items:center;animation:spin 8s linear infinite;flex:none}
.disc::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--side)}
@keyframes spin{to{transform:rotate(360deg)}}
.nb{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--muted);font-weight:500;position:relative;transition:background .15s,color .15s}
.nb:hover{background:var(--panel);color:var(--txt)}
.nb.on{background:var(--panel2);color:var(--txt)}
.nb.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--blue)}
.nb svg{width:18px;height:18px;flex:none}
.bdg{margin-left:auto;background:var(--orange);color:#111;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
.bdg.blue{background:var(--blue);color:#fff}
.dotr{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,77,94,.2)}
.navsp{flex:1}
.navfoot{font-size:11px;color:var(--muted);padding:10px 11px 2px;border-top:1px solid var(--line);margin-top:6px;line-height:1.6}
.navfoot i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(15,15,18,.9)}
.search{all:unset;cursor:pointer;flex:1;max-width:460px;display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px}
.kbd{margin-left:auto;font:11px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.tsp{flex:1}
.pill{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--green)}.pill.warn i{background:var(--orange);box-shadow:0 0 0 3px rgba(255,138,31,.2)}
.ib{all:unset;cursor:pointer;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);position:relative}
.ib[disabled]{opacity:.35;cursor:default}
.ib svg{width:17px;height:17px}
.ib .n{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.banner{display:flex;align-items:center;gap:12px;padding:9px 18px;background:rgba(255,138,31,.09);border-bottom:1px solid #4a3420;font-size:13px;color:#ffd2a8}
.banner.blue{background:rgba(47,164,255,.08);border-color:#23466a;color:#cfe6ff}
main{flex:1;overflow:auto;padding:22px 24px 30px}
.screen{animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
h1{font-size:24px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:2px 0 18px;font-size:13px}
h3{font-size:14px;margin-bottom:2px}
.hint{color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.hi{background:linear-gradient(135deg,rgba(47,164,255,.12),rgba(167,123,255,.06) 60%,var(--panel));border-color:#28415e}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g-lib{grid-template-columns:1fr 320px}.g-next{grid-template-columns:1fr 300px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}.mt{margin-top:14px}.mt2{margin-top:8px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;background:var(--blue);color:#fff;font-weight:600;font-size:13px;transition:filter .15s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt)}
.btn.orange{background:var(--orange);color:#140b00}.btn.green{background:var(--green);color:#04210f}.btn.red{background:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px}.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{all:unset;cursor:pointer;padding:5px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-size:12px}
.chip.on{border-color:var(--blue);color:var(--txt);background:rgba(47,164,255,.13)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:7px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--panel3);color:var(--txt)}
input.f,select.f,textarea.f{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 11px;font:inherit;font-size:13px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--blue)}
textarea.f{width:100%;min-height:110px;resize:vertical;line-height:1.55}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:9px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1;white-space:nowrap}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--txt)}
.tbl td{padding:7px 8px;border-bottom:1px solid #1d1d24;vertical-align:middle}
.tbl tr.r{cursor:pointer}.tbl tr.r:hover td{background:#1a1a20}.tbl tr.sel td{background:rgba(47,164,255,.09)}
.tw{max-height:calc(100vh - 290px);overflow:auto;border-radius:var(--r)}
.tt{display:flex;align-items:center;gap:10px;min-width:0}
.tt b,.tt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.tt small{color:var(--muted)}
.cv{width:36px;height:36px;border-radius:7px;flex:none;display:grid;place-items:center;font-weight:800;font-size:12px;color:rgba(0,0,0,.65);background-size:cover;background-position:center}
.cv.lg{width:64px;height:64px;font-size:20px;border-radius:10px}.cv.xl{width:84px;height:84px;font-size:26px;border-radius:12px}
.key{display:inline-block;min-width:36px;text-align:center;padding:2px 6px;border-radius:5px;font-weight:800;font-size:12px;color:#0b0b0d}
.key.est{outline:1px dashed rgba(255,255,255,.55);outline-offset:1px}
.key.none{background:#2a2a33!important;color:var(--muted)}
.nrg{display:inline-block;width:56px;height:6px;border-radius:3px;background:#262630;vertical-align:middle;overflow:hidden}
.nrg i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--orange))}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:5px;background:#24242c;color:#c9c9d3;white-space:nowrap}
.tag.ok{background:rgba(61,220,132,.13);color:var(--green)}.tag.warn{background:rgba(255,138,31,.14);color:var(--orange)}
.tag.bad{background:rgba(255,77,94,.14);color:var(--red)}.tag.info{background:rgba(47,164,255,.14);color:var(--blue)}.tag.learn{background:rgba(167,123,255,.15);color:var(--violet)}
.conf{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle}
.play{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;flex:none;background:var(--panel3);border:1px solid var(--line2);display:grid;place-items:center}
.play:hover{background:var(--blue);border-color:var(--blue)}.play.on{background:var(--orange);border-color:var(--orange)}
.play svg{width:12px;height:12px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:28px}
.big{font-size:22px;font-weight:800;letter-spacing:-.3px}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #22222a;cursor:pointer}
.ck:last-child{border:0}
.ck .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none}
.ck.done .bx{background:var(--green);border-color:var(--green)}
.ck.done span.l{color:var(--muted);text-decoration:line-through}
.ck .go{margin-left:auto;color:var(--muted);font-size:12px}
.mini{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #22222a;min-width:0}
.mini:last-child{border:0}
.stat{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #22222a;cursor:pointer}
.stat:last-child{border:0}.stat b{font-size:16px}
.bars .br{display:grid;grid-template-columns:100px 1fr 40px;gap:10px;align-items:center;margin:7px 0;font-size:12px;color:var(--txt2)}
.bars .tr{height:10px;background:#1f1f27;border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0}
.hist{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.hist .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.hist .c i{display:block;width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.hist .c span{font-size:10px;color:var(--muted)}
.now{display:flex;align-items:center;gap:16px}
.sg{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);margin-top:8px}
.sc{width:48px;flex:none;text-align:center}.sc b{font-size:18px;font-weight:800}
.sc .bar{height:4px;border-radius:2px;background:#2a2a33;margin-top:3px;overflow:hidden}.sc .bar i{display:block;height:100%}
.why{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.setrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);margin-top:6px}
.setrow .n{width:20px;color:var(--blue);font-weight:800;text-align:center}
.trn{display:flex;justify-content:center;margin:-2px 0 -2px 30px}
.mi{all:unset;cursor:pointer;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.mi:hover{background:var(--panel3);color:var(--txt)}
.wheel text{font-size:9px;font-weight:700;pointer-events:none}.wheel path{cursor:pointer}
.drop{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;max-height:300px;overflow:auto;z-index:20;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.drop div{padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:10px}.drop div:hover{background:var(--panel3)}
.trend{display:grid;grid-template-columns:34px 40px 1fr auto auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid #20202a}
.rank{font-weight:800;font-size:18px;color:var(--txt2);text-align:center;line-height:1}.rank small{display:block;font-size:10px;margin-top:3px}
.place{font-size:11px;color:var(--muted);margin-top:3px}.place b{color:var(--txt2);font-weight:600}
.src{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line2);color:var(--muted);margin-right:3px}
.mic{all:unset;cursor:pointer;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;margin:14px auto 8px;background:radial-gradient(circle at 35% 30%,#ff7180,#c5172d);box-shadow:0 0 0 10px rgba(255,77,94,.10),0 0 0 22px rgba(255,77,94,.05),0 18px 40px rgba(200,20,40,.35)}
.mic.rec{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(255,77,94,.22),0 0 0 36px rgba(255,77,94,.08)}}
.mic svg{width:48px;height:48px}
.guide{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.guide span{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--txt2)}
.pt{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #22222a}
.pt input{accent-color:var(--green);width:17px;height:17px;margin-top:2px;flex:none}
.pt q{display:block;color:var(--muted);font-size:12px;margin-top:3px;font-style:italic}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.empty svg{width:40px;height:40px;opacity:.4;margin-bottom:8px}
.player{display:flex;align-items:center;gap:12px;padding:9px 18px;border-top:1px solid var(--line);background:linear-gradient(#111116,#0d0d11)}
.player .info{min-width:0;flex:0 1 280px}
.player .info b,.player .info small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .info small{color:var(--muted);font-size:11px}
.pbar{flex:1;height:5px;background:#24242c;border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--orange))}
.ov{position:fixed;inset:0;background:rgba(5,5,8,.72);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px;width:min(560px,100%);box-shadow:0 40px 100px rgba(0,0,0,.6);animation:pop .25s var(--ease);max-height:90vh;overflow:auto}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal h2{font-size:19px;margin-bottom:4px}
.step{display:flex;align-items:center;gap:10px;padding:7px 0;color:var(--muted)}
.step.done{color:var(--txt)}.step.err{color:var(--red)}
.step .st{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:11px;flex:none}
.step.done .st{background:var(--green);border-color:var(--green);color:#04210f}
.step.err .st{background:var(--red);border-color:var(--red);color:#fff}
.step.run .st{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.prog{height:8px;background:#22222a;border-radius:4px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .2s}
.pal{width:min(600px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;align-self:start;margin-top:12vh}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 18px;color:var(--txt);font-size:16px;outline:none}
.pal .res{max-height:360px;overflow:auto;padding:6px}
.pal .it{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer}
.pal .it.on{background:var(--panel3)}.pal .it small{margin-left:auto;color:var(--muted);font-size:11px}
.notif{position:fixed;top:56px;right:18px;width:340px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 30px 70px rgba(0,0,0,.55);z-index:40;padding:6px;max-height:60vh;overflow:auto}
.notif .it{display:flex;gap:10px;padding:10px;border-radius:8px;cursor:pointer}.notif .it:hover{background:var(--panel2)}
.notif .it i{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px;flex:none}
.toasts{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center;max-width:92vw;pointer-events:none}
.toast{background:#1c2633;border:1px solid #2f5d86;color:#fff;padding:10px 12px 10px 16px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop .25s var(--ease)}
.toast.err{background:#331c22;border-color:#86303f}
.toast button{all:unset;cursor:pointer;color:var(--blue);font-weight:700;padding:2px 6px;pointer-events:auto}
.toast{max-width:min(420px,92vw);pointer-events:none}.toast .tm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.toast.out{opacity:0;transition:opacity .18s}
.sgt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .row .btn.sm{white-space:normal;text-align:center;max-width:100%}.sgw{overflow-wrap:anywhere}
.setrow.flash{animation:flash 1.1s var(--ease)}@keyframes flash{0%{background:rgba(47,164,255,.35);border-color:var(--blue)}100%{background:var(--panel2)}}
.tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--line2);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;z-index:70;opacity:0;max-width:260px}
.conn{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-top:8px}
.conn .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}.dots i.on{background:var(--blue);width:20px;border-radius:4px}
.counter{font-size:30px;font-weight:800}
code{font:12px ui-monospace,Menlo,monospace;background:var(--panel3);padding:1px 5px;border-radius:4px}
@media (max-width:980px){.g-lib,.g-next{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
.nb .ls{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--line2);transform:translateY(-2px)}
.tile .ti{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:8px}
.tile .tx{display:flex;flex-direction:column;gap:3px;min-width:0}.tile b{font-size:17px}.tile .tx span{color:var(--muted);font-size:13px}
.ring{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;background:radial-gradient(closest-side,var(--panel) 76%,transparent 78%),conic-gradient(var(--green) calc(var(--p)*360deg),#2a2a33 0)}
.clk{cursor:pointer}.clk:hover{border-color:var(--line2)}.go{color:var(--muted);font-size:18px}
.sbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px 6px 6px 14px;color:var(--muted)}
.sbar:focus-within{border-color:var(--blue)}

<script>
"use strict";
/* =====================================================================
   SETMATE · assistant DJ pour Serato
   Tout reste dans ce navigateur (IndexedDB) et dans les dossiers que tu autorises.
   ===================================================================== */
const VERSION="1.8";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>" "+String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim()+" ";
const baseTitle=s=>norm(String(s||"").replace(/\((feat|ft|with|prod)[^)]*\)|\[[^\]]*\]|\b(feat|ft)\.? .*$/gi,"").replace(/\((extended|clean|dirty|explicit|radio edit|original mix|intro|edit|remaster(ed)?[^)]*)\)/gi,""));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const FSA=typeof window.showDirectoryPicker==="function";
const MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&matchMedia("(pointer:coarse)").matches);

/* ===================== STOCKAGE LOCAL (IndexedDB) ===================== */
const DB={db:null,ok:true,
  open(){return new Promise(res=>{try{const r=indexedDB.open("setmate",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>{DB.ok=false;res()};}catch(e){DB.ok=false;res()}});},
  get(k){if(!DB.db)return Promise.resolve(undefined);return new Promise(res=>{const t=DB.db.transaction("kv").objectStore("kv").get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(undefined);});},
  set(k,v){if(!DB.db)return Promise.resolve();return new Promise(res=>{try{const t=DB.db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res();t.onerror=()=>res();}catch(e){res()}});},
  del(k){if(!DB.db)return Promise.resolve();return new Promise(res=>{const t=DB.db.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=()=>res();});}};

const S={
  screen:"home",name:"",demo:false,tracks:[],nextN:1,userRoot:"",musicPrefix:"",
  set:{name:"Mon set",ids:[],gig:null},cur:null,dir:"any",sameGenre:false,keyF:null,
  libQ:"",libG:"Tous",libB:"all",libView:"all",sort:["t",1],sel:null,libLimit:200,crates:{},
  L:{},P:{},rules:[],genreFix:{},todo:[],notifs:[],gigs:[],created:[],
  trends:{date:0,items:[]},trendCache:{},genres:{rap:1,afro:1,rnb:1,amapiano:1,pop:1},
  flags:{},reco:{ttl:30},seratoVer:null,seratoDbAge:null,disc:{date:0,items:[],extra:[]},search:{q:"",items:[]},found:{},trTab:"moment",tips:{},showOpts:false,openWhy:null,
  styles:{amapiano:1,afrobeats:1,shatta:1,dancehall:1,kompa:1,"rap fr":1,rnb:1},
  dGig:null,dTxt:"",dPts:null,dlLast:0,onboarded:false,undo:[]
};
const H={serato:null,music:null,dl:null};      // dossiers autorisés
const PERM={serato:"none",music:"none",dl:"none"};
let byN=new Map(),byPath=new Map();
function reindex(){byN=new Map();byPath=new Map();S.tracks.forEach(t=>{byN.set(t.n,t);byPath.set(t.path,t)});}
const T=n=>byN.get(n);
let saveT=null,tracksDirty=false;
function save(tracksToo=false){if(tracksToo)tracksDirty=true;clearTimeout(saveT);saveT=setTimeout(async()=>{
  const st={};for(const k of ["name","demo","realSnap","nextN","userRoot","musicPrefix","set","cur","dir","crates","L","P","rules","genreFix","todo","notifs","gigs","created","trends","trendCache","genres","dlLast","onboarded","disc","found","styles","tips","trTab","flags","reco","seratoVer","seratoDbAge","pls","own","lsTab","seenV","am","recTab"])st[k]=S[k];
  await DB.set("state",st);if(tracksDirty){await DB.set("tracks",S.tracks);tracksDirty=false;}},400);}
async function load(){
  await DB.open();
  const st=await DB.get("state");if(st)Object.assign(S,st);
  // reprise des données de la version 1.0
  (S.trends.items||[]).forEach((x,i)=>{if(x.pos==null)x.pos=x.rank||i+1;});
  S.disc=Object.assign({items:[],extra:[],seen:[],usedPl:[],qi:{}},S.disc||{});S.search={q:"",items:[]};
  S.tracks=(await DB.get("tracks"))||[];reindex();
  // reprise de la version 1.1 : l’ancienne liste à part devient des sons de sa musique « à récupérer »
  if((S.todo||[]).length){for(const t of S.todo){if(t.src==="auto")continue;
      if(t.src==="qualite"){const x=S.tracks.find(y=>baseTitle(y.t)===baseTitle(t.t));if(x)x.upgrade=true;continue;}
      if(t.dz)addToLib({dz:t.dz,t:t.t,a:t.a,cover:t.cover},t.src==="soiree"?"soiree":"moi");}
    S.todo=[];save(true);}
  for(const k of ["serato","music","dl"]){H[k]=(await DB.get("h_"+k))||null;if(H[k])PERM[k]=await permOf(H[k],modeOf(k));}
}
const modeOf=k=>k==="serato"?"readwrite":"read";
async function permOf(h,mode){try{return await h.queryPermission({mode});}catch(e){return "none";}}
async function ensurePerm(k,mode){const h=H[k];if(!h)return false;try{let p=await h.queryPermission({mode});if(p!=="granted")p=await h.requestPermission({mode});PERM[k]=p;return p==="granted";}catch(e){return false;}}

/* ===================== FORMAT SERATO (base, crates) =====================
   Enregistrements : étiquette 4 lettres + longueur 32 bits big-endian + contenu.
   1re lettre = type : o/r imbriqué, t/p texte UTF-16BE, u entier 32 bits, s entier 16 bits, b booléen.
   Chemins sans "/" initial, relatifs à la racine du disque (ex. Users/ines/Music/DJ/son.mp3). */
const dec16=new TextDecoder("utf-16be");
function serParse(buf){
  const u8=buf instanceof Uint8Array?buf:new Uint8Array(buf),dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  function rec(o,end){const out=[];while(o+8<=end){
    const tag=String.fromCharCode(u8[o],u8[o+1],u8[o+2],u8[o+3]),len=dv.getUint32(o+4),s=o+8,e=s+len;if(e>end)break;
    const ty=tag==="vrsn"?"t":tag[0];let v;
    if(ty==="o"||ty==="r")v=rec(s,e);
    else if(ty==="t"||ty==="p")v=dec16.decode(u8.subarray(s,e)).replace(/\0+$/,"");
    else if(ty==="u")v=len>=4?dv.getUint32(s):0;else if(ty==="s")v=len>=2?dv.getUint16(s):0;else if(ty==="b")v=len>=1&&u8[s]!==0;
    else v=u8.slice(s,e);
    out.push([tag,v]);o=e;}return out;}
  return rec(0,u8.length);
}
function enc16(s){const b=new Uint8Array(s.length*2);for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);b[2*i]=c>>8;b[2*i+1]=c&255;}return b;}
function concat(parts){const n=parts.reduce((a,p)=>a+p.length,0),o=new Uint8Array(n);let i=0;for(const p of parts){o.set(p,i);i+=p.length;}return o;}
function serEnc(items){const parts=[];for(const [tag,v] of items){const ty=tag==="vrsn"?"t":tag[0];let p;
  if(ty==="o"||ty==="r")p=serEnc(v);else if(ty==="t"||ty==="p")p=enc16(v);
  else if(ty==="u"){p=new Uint8Array(4);new DataView(p.buffer).setUint32(0,v>>>0);}else if(ty==="s"){p=new Uint8Array(2);new DataView(p.buffer).setUint16(0,v&65535);}
  else if(ty==="b")p=new Uint8Array([v?1:0]);else p=v instanceof Uint8Array?v:new Uint8Array(0);
  const h=new Uint8Array(8);for(let i=0;i<4;i++)h[i]=tag.charCodeAt(i);new DataView(h.buffer).setUint32(4,p.length);parts.push(h,p);}
  return concat(parts);}
const CRATE_COLS=["song","playCount","artist","bpm","key","album","length","comment","added"];
function buildCrate(paths){return serEnc([["vrsn","1.0/Serato ScratchLive Crate"],["osrt",[["tvcn","key"],["brev",false]]],...CRATE_COLS.map(c=>["ovct",[["tvcn",c],["tvcw","0"]]]),...paths.map(p=>["otrk",[["ptrk",relPath(p)]]])]);}
function crateTracks(buf){return serParse(buf).filter(r=>r[0]==="otrk").map(r=>(r[1].find(f=>f[0]==="ptrk")||[])[1]).filter(Boolean);}
const relPath=p=>String(p).replace(/^[A-Za-z]:/,"").replace(/\\/g,"/").replace(/^\/+/,"");
const fld=(rec,tag)=>{const f=rec.find(x=>x[0]===tag);return f?f[1]:undefined;};

/* ===================== TONALITÉS ===================== */
const MINOR={9:8,4:9,11:10,6:11,1:12,8:1,3:2,10:3,5:4,0:5,7:6,2:7},MAJOR={0:8,7:9,2:10,9:11,4:12,11:1,6:2,1:3,8:4,3:5,10:6,5:7};
const PC={c:0,d:2,e:4,f:5,g:7,a:9,b:11};
function toCamelot(k){
  if(!k)return null;let s=String(k).trim().replace(/♯/g,"#").replace(/♭/g,"b");
  let m=s.match(/^(\d{1,2})\s*([AB])$/i);if(m&&+m[1]>=1&&+m[1]<=12)return +m[1]+m[2].toUpperCase();
  m=s.match(/^(\d{1,2})\s*([dm])$/i);if(m&&+m[1]>=1&&+m[1]<=12)return (((+m[1]+6)%12)+1)+(m[2].toLowerCase()==="m"?"A":"B");
  m=s.match(/^([A-Ga-g])\s*([#b]?)\s*(m|min|minor|moll|-)?\s*(maj|major)?$/);
  if(m){let pc=PC[m[1].toLowerCase()]+(m[2]==="#"?1:m[2]==="b"?-1:0);pc=(pc+12)%12;const minor=!!m[3]&&!m[4];return (minor?MINOR[pc]+"A":MAJOR[pc]+"B");}
  return null;
}
const kn=k=>parseInt(k),kl=k=>String(k).slice(-1);
const keyColor=k=>k?`hsl(${((kn(k)-1)*30+200)%360},${kl(k)==="A"?72:62}%,${kl(k)==="A"?60:72}%)`:"#2a2a33";
const keyTag=(k,est)=>k?`<span class="key ${est?"est":""}" style="background:${keyColor(k)}" ${est?'data-tip="Tonalité estimée par SetMate"':""}>${k}</span>`:`<span class="key none" data-tip="Tonalité inconnue">?</span>`;

/* ===================== GENRES ===================== */
const GENRE_RULES=[
 [/amapiano|piano ?house|log ?drum/,"Afro","Amapiano"],[/afro ?house/,"Afro","Afro house"],[/shatta/,"Afro","Shatta"],[/kompa|konpa/,"Afro","Kompa"],[/zouk/,"Afro","Zouk"],
 [/dancehall|reggae|soca|bouyon/,"Afro","Dancehall"],[/afrobeat|afro ?pop|afropop|naija|afro|coupe ?decale|ndombolo|bongo|gqom|african/,"Afro","Afrobeats"],
 [/drill/,"Hip-hop","Drill"],[/rap fr|french rap|rap francais|francais|french/,"Hip-hop","Rap FR"],[/trap/,"Hip-hop","Trap"],[/hip ?hop|rap/,"Hip-hop","Rap US"],
 [/r ?n ?b|r b|rnb|soul|neo soul/,"R&B","R&B"],[/latin|reggaeton|dembow/,"Open format","Latino"],[/house|techno|edm|electro|dance/,"Open format","House / Dance"],
 [/disco|funk|80s|90s|oldies|classic/,"Open format","Classiques"],[/pop|hits|variete|chanson/,"Open format","Hits"]];
function classify(genre,artist){
  const fx=S.genreFix[norm(artist).trim()];if(fx)return [fx[0],fx[1],85,"appris"];
  const n=norm(genre);if(!n.trim())return ["?","Inconnu",0,"aucun"];
  for(const [re,g,sg] of GENRE_RULES)if(re.test(n))return [g,sg,re.source.length>6&&n.trim().length<30?90:75,"tag"];
  return ["?",String(genre).slice(0,24),30,"tag"];
}
const eraOf=y=>!y?"?":y<1990?"80s et avant":y<2000?"90s":y<2010?"2000s":y<2020?"2010s":"Actuel";

/* ===================== ANALYSE AUDIO (BPM, tonalité, énergie) =====================
   Validée sur 12 sons connus : BPM juste sur 11 (le 12e au double), tonalité juste ou voisine dans la plupart des cas. */
function smFFT(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]];}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<len/2;k++){const a=i+k,b=a+len/2;const tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;const ncr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=ncr;}}}}
function smAnalyze(ab,maxSec=45){
  const sr0=ab.sampleRate,step=sr0>=88200?4:sr0>=44100?2:1,sr=sr0/step,total=ab.length,take=Math.min(total,Math.floor(maxSec*sr0)),start=Math.max(0,Math.floor((total-take)/2));
  const chs=[];for(let c=0;c<ab.numberOfChannels;c++)chs.push(ab.getChannelData(c));
  const N=Math.floor(take/step),x=new Float32Array(N);for(let i=0;i<N;i++){let s=0;for(const ch of chs)s+=ch[start+i*step];x[i]=s/chs.length;}
  const F=1024,Hh=256,frames=Math.floor((N-F)/Hh);if(frames<200)return null;
  const win=new Float32Array(F);for(let i=0;i<F;i++)win[i]=.5-.5*Math.cos(2*Math.PI*i/F);
  const maxBin=Math.min(F/2,Math.floor(8000/(sr/F)));const env=new Float32Array(frames),chroma=new Float64Array(12);
  const F2=4096,pc2=new Int8Array(F2/2).fill(-1),cnt=new Float64Array(12);
  for(let b=1;b<F2/2;b++){const f=b*sr/F2;if(f>=110&&f<=2000){const p=((Math.round(12*Math.log2(f/440))+69)%12+12)%12;pc2[b]=p;cnt[p]++;}}
  const win2=new Float32Array(F2);for(let i=0;i<F2;i++)win2[i]=.5-.5*Math.cos(2*Math.PI*i/F2);
  const re2=new Float64Array(F2),im2=new Float64Array(F2);
  for(let s0=0;s0+F2<N;s0+=2048){for(let i=0;i<F2;i++){re2[i]=x[s0+i]*win2[i];im2[i]=0;}smFFT(re2,im2);const fr=new Float64Array(12);
    for(let b=1;b<F2/2;b++)if(pc2[b]>=0)fr[pc2[b]]+=Math.hypot(re2[b],im2[b])/cnt[pc2[b]];const mx=Math.max(...fr)||1;for(let p=0;p<12;p++)chroma[p]+=fr[p]/mx;}
  let prev=new Float32Array(maxBin),rmsSum=0,cenSum=0,cenW=0;const re=new Float64Array(F),im=new Float64Array(F);
  for(let t=0;t<frames;t++){let e=0;for(let i=0;i<F;i++){const v=x[t*Hh+i];re[i]=v*win[i];im[i]=0;e+=v*v;}rmsSum+=Math.sqrt(e/F);smFFT(re,im);
    let flux=0;const cur=new Float32Array(maxBin);for(let b=1;b<maxBin;b++){const m=Math.hypot(re[b],im[b]);cur[b]=Math.log1p(10*m);const d=cur[b]-prev[b];if(d>0)flux+=d;cenSum+=m*b*sr/F;cenW+=m;}env[t]=flux;prev=cur;}
  const hopSec=Hh/sr,W=Math.round(.5/hopSec),on=new Float32Array(frames);let acc=0;
  for(let t=0;t<frames;t++){acc+=env[t];if(t>=W)acc-=env[t-W];on[t]=Math.max(0,env[t]-acc/Math.min(t+1,W));}
  const ac=l=>{let s=0;for(let i=0;i+l<frames;i++)s+=on[i]*on[i+l];return s/(frames-l);};
  const lagMin=Math.floor(60/200/hopSec),lagMax=Math.ceil(60/60/hopSec);const A=new Float64Array(4*lagMax+4);for(let l=1;l<=4*lagMax+3;l++)A[l]=l<frames-50?ac(l):0;

async function readTags(file){
  const out={t:"",a:"",bpm:null,key:null,genre:"",year:null};
  const base=file.name.replace(/\.[^.]+$/,"");const m=base.match(/^(.+?)\s+-\s+(.+)$/);if(m){out.a=m[1].trim();out.t=m[2].trim();}else out.t=base;
  try{const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(head[0]===73&&head[1]===68&&head[2]===51){const ver=head[3],size=((head[6]&127)<<21)|((head[7]&127)<<14)|((head[8]&127)<<7)|(head[9]&127);
      const b=new Uint8Array(await file.slice(10,10+Math.min(size,4e6)).arrayBuffer());let o=0;
      const txt=(s,e)=>{const enc=b[s];const d=b.subarray(s+1,e);try{if(enc===1||enc===2){return new TextDecoder(enc===2?"utf-16be":"utf-16").decode(d).replace(/\0/g,"").trim();}return new TextDecoder(enc===3?"utf-8":"latin1").decode(d).replace(/\0/g,"").trim();}catch(e){return "";}};
      while(o+10<b.length){const id=String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
        const sz=ver===4?((b[o+4]&127)<<21)|((b[o+5]&127)<<14)|((b[o+6]&127)<<7)|(b[o+7]&127):(b[o+4]<<24)|(b[o+5]<<16)|(b[o+6]<<8)|b[o+7];
        const s=o+10,e=s+sz;if(sz<=0||e>b.length)break;
        if(id==="TIT2")out.t=txt(s,e)||out.t;if(id==="TPE1")out.a=txt(s,e)||out.a;if(id==="TBPM")out.bpm=parseFloat(txt(s,e))||null;
        if(id==="TKEY")out.key=txt(s,e);if(id==="TCON")out.genre=txt(s,e).replace(/^\(\d+\)/,"");if(id==="TYER"||id==="TDRC")out.year=parseInt(txt(s,e))||null;o=e;}}}catch(e){}

}

      if(o.manual){t.g=o.g;t.sg=o.sg;t.conf=100;t.manual=true;}else{const c=classify(genre,artist);t.g=c[0];t.sg=c[1];t.conf=c[2];t.gSrc=c[3];}
      t.era=eraOf(t.year);out.push(t);const m=path.match(/^(Users\/[^/]+\/)/);if(m)roots[m[1]]=(roots[m[1]]||0)+1;}
    let linked=0;
    for(const t of S.tracks){if(t.inSerato||out.some(x=>x.path===t.path))continue;
      // un son « à récupérer » (ou ajouté depuis Téléchargements) maintenant présent dans Serato : on fusionne et on garde ce qui a été appris
      const bt=baseTitle(t.t),a=norm(t.a).split(" ")[1]||"";const s=bt.trim()&&out.find(x=>baseTitle(x.t)===bt&&(!a||norm(x.a).includes(" "+a)));
      if(s&&(t.wish||t.local)){mergeInto(t,s);linked++;continue;}out.push(t);}
    if(linked&&announce!==false)setTimeout(()=>toast(`${pl(linked,"son")} « à récupérer » retrouvé${linked>1?"s":""} dans Serato et relié${linked>1?"s":""}.`),300);

function mergeInto(from,to){const a=from.n,b=to.n;
  if(S.L[a]&&!S.L[b])S.L[b]=S.L[a];delete S.L[a];
  for(const k of Object.keys(S.P)){const [x,y]=k.split(">").map(Number);if(x===a||y===a){S.P[(x===a?b:x)+">"+(y===a?b:y)]=S.P[k];delete S.P[k];}}
  S.set.ids=S.set.ids.map(n=>n===a?b:n);if(S.cur===a)S.cur=b;
  S.gigs.forEach(g=>{g.played=(g.played||[]).map(n=>n===a?b:n);});
  if(!to.e&&from.e)to.e=from.e;if(!to.cover&&from.cover)to.cover=from.cover;if(from.manual&&!to.manual){to.g=from.g;to.sg=from.sg;to.conf=100;to.manual=true;}
  if(from.lastPlayed&&(!to.lastPlayed||to.lastPlayed<from.lastPlayed))to.lastPlayed=from.lastPlayed;}
function findDups(){const g={};S.tracks.forEach(t=>{t.dupOf=null;if(t.notDup||t.wish)return;const k=baseTitle(t.t)+"|"+norm(t.a).split(" ")[1];(g[k]=g[k]||[]).push(t);});
  for(const arr of Object.values(g))if(arr.length>1){arr.sort((a,b)=>(b.kbps||0)-(a.kbps||0));for(const t of arr.slice(1))t.dupOf=arr[0].n;}}
async function mapMusic(){
  const name=H.music.name;const sample=S.tracks.filter(t=>t.inSerato).slice(0,400);const counts={};
  for(const t of sample){const i=("/"+t.path).indexOf("/"+name+"/");if(i>=0){const pre=t.path.slice(0,i-1+name.length+2);counts[pre]=(counts[pre]||0)+1;}}
  const cands=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  for(const pre of cands){let ok=0;for(const t of sample.filter(t=>t.path.startsWith(pre)).slice(0,6)){if(await fileOf(t,pre))ok++;}if(ok){S.musicPrefix=pre;save();toast(`Dossier Musique relié : ${ok} fichiers vérifiés.`);return;}}
  S.musicPrefix="";save();
  if(S.tracks.some(t=>t.inSerato))toast(`Je n’ai pas retrouvé tes sons Serato dans « ${esc(name)} ». Choisis le dossier qui contient ta musique (souvent Musique).`,false,true);
}
async function walk(dir,rel){const parts=rel.split("/");let d=dir;for(let i=0;i<parts.length-1;i++)d=await d.getDirectoryHandle(parts[i]);return await d.getFileHandle(parts[parts.length-1]);}
async function fileOf(t,pre=S.musicPrefix){
  try{if(t.local&&H[t.local.root]){return await (await walk(H[t.local.root],t.local.rel)).getFile();}
    if(H.music&&pre&&t.path.startsWith(pre))return await (await walk(H.music,t.path.slice(pre.length))).getFile();}catch(e){}
  return null;
}

      <div><span class="hint">Énergie</span><br>${x.e?nrg(x.e)+" "+x.e+"/10":`<button class="btn sm ghost" onclick="analyzeOne(${x.n})">Analyser</button>`}</div><div><span class="hint">Époque</span><br><b>${esc(x.era)}</b>${x.year?` <span class="hint">${x.year}</span>`:""}</div>
      <div><span class="hint">Qualité</span><br><b style="color:${x.kbps&&x.kbps<192?"var(--red)":"inherit"}">${x.kbps?Math.round(x.kbps)+" kbps":"?"}</b></div><div><span class="hint">Dernière fois joué</span><br><b>${x.lastPlayed?"il y a "+Math.round((Date.now()-x.lastPlayed)/864e5)+" j":"pas de trace"}</b></div></div>
    <div class="card mt" style="background:var(--panel2);padding:12px"><div class="row between"><span class="hint">Genre ${x.manual?"(choisi par toi)":x.gSrc==="appris"?"(appris de tes corrections)":x.genreTag?"(tag : "+esc(x.genreTag)+")":"(aucun tag)"}</span><span style="color:${cc};font-weight:700;font-size:12px">${x.conf} %</span></div>

      <p class="hint mt2">Ta correction s’applique aussi aux autres sons de ${esc(x.a||"cet artiste")} non vérifiés.</p></div>

    ${x.kbps&&x.kbps<192?`<div class="card mt" style="background:rgba(255,138,31,.06);border-color:#4a3420;padding:12px"><b>Qualité faible (${Math.round(x.kbps)} kbps)</b><p class="hint mt2">Fréquent avec les convertisseurs. Sur une grosse sono, ça peut s’entendre.</p>${x.upgrade?`<span class="tag info mt2">Noté à remplacer</span>`:`<button class="btn sm ghost mt2" onclick="toTodo(${x.n})">Noter « à remplacer »</button>`}</div>`:""}
    ${x.missing?`<div class="card mt" style="padding:12px"><b>Introuvable pour Serato</b><p class="hint mt2">Serato signale ce fichier comme manquant (déplacé ou supprimé).</p></div>`:""}

function okGenre(n){const x=T(n),o=[x.conf,x.manual];x.conf=100;x.manual=true;pushUndo("validation du genre",()=>{[x.conf,x.manual]=o});save(true);toast("Genre validé.",true);afterLib();}
function setGenre(n,v){if(!v)return;const x=T(n),[g,sg]=v.split("|");const ak=norm(x.a).trim();const changed=[];
  for(const t of S.tracks)if(t===x||(ak&&norm(t.a).trim()===ak&&!t.manual&&t.conf<85)){changed.push([t,t.g,t.sg,t.conf,t.manual,t.gSrc]);t.g=g;t.sg=sg;t.conf=t===x?100:85;t.manual=t===x;t.gSrc=t===x?"toi":"appris";}
  const oldFix=S.genreFix[ak];if(ak)S.genreFix[ak]=[g,sg];
  pushUndo("correction du genre",()=>{changed.forEach(([t,a,b,c,d,e])=>{t.g=a;t.sg=b;t.conf=c;t.manual=d;t.gSrc=e;});if(oldFix)S.genreFix[ak]=oldFix;else delete S.genreFix[ak];});
  save(true);toast(`Corrigé : ${g} › ${sg}${changed.length>1?` (+${changed.length-1} sons du même artiste)`:""}.`,true);afterLib();}
function hideTrack(n){const x=T(n);x.hidden=true;pushUndo("masquage",()=>{x.hidden=false});S.sel=null;save(true);toast("Masqué dans SetMate. Le fichier reste sur ton disque.",true);afterLib();}
function notDup(n){const x=T(n),o=x.dupOf;x.dupOf=null;x.notDup=true;pushUndo("doublon",()=>{x.dupOf=o});save(true);afterLib();}
function toTodo(n){const x=T(n);x.upgrade=true;pushUndo("à remplacer",()=>{x.upgrade=false;});save(true);toast(`« ${esc(x.t)} » noté « à remplacer » (Tendances › À récupérer).`,true);renderNav();}
function afterLib(){renderNav();if(S.screen==="lib"){libTable();$("#libSide").innerHTML=libSide();}}
let anaRun=false;
async function analyzeOne(n){const x=T(n);const f=await fileOf(x);if(!f){toast("Fichier non accessible. Connecte ton dossier Musique dans Réglages.",false,true);return;}
  toast("Analyse en cours…");try{const r=await analyzeFile(f);applyAnalysis(x,r);save(true);afterLib();toast(`Analysé : ${Math.round(r.bpm)} BPM, ${r.key}, énergie ${r.energy}/10.`);}catch(e){toast("Analyse impossible : "+esc(e.message),false,true);}}
function applyAnalysis(x,r){if(!r)return;x.e=r.energy;x.bpmEst=r.bpm;x.kEst=r.key;if(!x.bpm||x.bpmSrc==="est"){x.bpm=r.bpm;x.bpmSrc="est";}if(!x.k||x.kSrc==="est"){x.k=r.key;x.kSrc="est";}}
async function analyzeMissing(){
  if(anaRun){anaRun=false;return;}const list=visible().filter(x=>!x.e);if(!list.length){toast("Tout est déjà analysé.");return;}
  anaRun=true;modal(`<h2>Analyse de ta musique</h2><p class="hint">Énergie de chaque son, et BPM ou tonalité quand Serato ne les a pas. Tu peux continuer à utiliser SetMate.</p><div class="prog"><i id="anP"></i></div><p class="hint" id="anT">0 / ${list.length}</p><div class="row mt" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Continuer en arrière-plan</button><button class="btn ghost" onclick="anaRun=false;closeModal()">Arrêter</button></div>`);
  let done=0,fail=0;for(const x of list){if(!anaRun)break;try{const f=await fileOf(x);if(f){applyAnalysis(x,await analyzeFile(f));}else fail++;}catch(e){fail++;}done++;
    const p=$("#anP");if(p){p.style.width=(done/list.length*100)+"%";$("#anT").textContent=`${done} / ${list.length}${fail?` · ${fail} non lus`:""} · ${esc(x.t)}`;}if(done%20===0)save(true);await sleep(5);}
  anaRun=false;save(true);closeModal();toast(`Analyse terminée : ${done-fail} sons${fail?`, ${fail} fichiers non lus`:""}.`);if(S.screen==="lib")render();}

/* ===================== SON SUIVANT ===================== */
function pitch(a,b){let best=[[b,""],[b*2,"double"],[b/2,"moitié"]].map(([v,m])=>({v,m,d:Math.abs(v-a)})).sort((x,y)=>x.d-y.d)[0];
  if(best.m&&Math.abs(best.v-a)/a*100>8)best={v:b,m:""};   // double / moitié seulement si ça se mixe vraiment
  const pct=(best.v-a)/a*100,ap=Math.abs(pct),s=ap<=2?1:ap>=8?0:1-(ap-2)/6,diff=Math.round(b-a);
  return {s,pct,m:best.m,lab:best.m?`BPM ${best.m} (${Math.round(b)})`:(diff===0?"Même BPM":`${diff>0?"+":""}${diff} BPM`)};}
function keyS(a,b){if(!a||!b)return [.5,"Tonalité inconnue"];const d=(kn(b)-kn(a)+12)%12;
  if(a===b)return [1,"Même tonalité"];if(kn(a)===kn(b))return [.85,"Tonalité relative"];if((d===1||d===11)&&kl(a)===kl(b))return [.9,"Tonalité voisine"];
  if(d===2&&kl(a)===kl(b))return [.6,"+2 · boost d’énergie"];if(d===7&&kl(a)===kl(b))return [.5,"+7 · changement marqué"];return [.15,"Tonalité éloignée"];}
const GW=[["amapiano",x=>x.sg==="Amapiano","amapiano"],["afrobeat",x=>x.sg==="Afrobeats","afrobeats"],["afro",x=>x.g==="Afro","afro"],["rap",x=>x.g==="Hip-hop","rap"],["drill",x=>x.sg==="Drill","drill"],[" r b ",x=>x.g==="R&B","R&B"],["rnb",x=>x.g==="R&B","R&B"],["dancehall",x=>x.sg==="Dancehall","dancehall"],["shatta",x=>x.sg==="Shatta","shatta"],["kompa",x=>x.sg==="Kompa","kompa"],["zouk",x=>x.sg==="Zouk","zouk"],["hits",x=>x.g==="Open format","hits"],["house",x=>x.sg==="House / Dance","house"]];
function ruleEffects(rules=S.rules){const ef=[];rules.forEach(r=>{const n=norm(r);GW.forEach(([w,f,l])=>{const i=n.indexOf(w.startsWith(" ")?w:" "+w);if(i<0)return;const pre=n.slice(Math.max(0,i-24),i);
  let sgn=0;if(/trop|moins/.test(pre))sgn=-1;else if(/plus|voulai|reclam|demand|assez|manqu|envie/.test(pre))sgn=1;if(sgn&&!ef.some(e=>e.l===l))ef.push({f,sgn,l});});});return ef;}
function compat(cur,c,full=true){
  let s,why=[];
  if(cur.bpm&&c.bpm){const p=pitch(cur.bpm,c.bpm);s=.4*p.s;why.push([p.s>.75?"ok":p.s>.3?"warn":"bad",p.lab+(Math.abs(p.pct)>=.5&&Math.abs(p.pct)<=12&&!p.m?` · pitch ${p.pct>0?"+":""}${p.pct.toFixed(1).replace(".",",")} %`:"")]);}
  else{s=.2;why.push(["warn","BPM inconnu"]);}
  const [ks,kl2]=keyS(cur.k,c.k);s+=.4*ks;why.push([ks>=.85?"ok":ks>=.5?"warn":"bad",kl2+(c.kSrc==="est"?" (estimée)":"")]);
  const days=c.lastPlayed?Math.round((Date.now()-c.lastPlayed)/864e5):null;
  if(days!=null&&days<14){s+=.05;why.push(["warn",`Joué il y a ${days} j`]);}else{s+=.2;why.push(["ok",days==null?"Pas joué récemment":`Pas joué depuis ${days} j`]);}
  if(full){if(S.L[c.n]){s+=S.L[c.n].v;why.push(["learn",S.L[c.n].why]);}const pk=cur.n+">"+c.n;if(S.P[pk]){s+=S.P[pk].v;why.push(["learn",S.P[pk].why]);}
    ruleEffects().forEach(e=>{if(e.f(c)){s+=e.sgn*.08;why.push(["learn",`Règle : ${e.sgn>0?"plus":"moins"} ${de(e.l)}`]);}});
    if(S.dir!=="any"&&cur.e&&c.e){const d=c.e-cur.e;if(S.dir==="up"){s+=d>0?.07:d<0?-.1:0;if(d>0)why.push(["info","Monte l’énergie"]);}if(S.dir==="keep"){s+=Math.abs(d)<=1?.06:-.06;if(Math.abs(d)<=1)why.push(["info","Garde l’énergie"]);}if(S.dir==="down"){s+=d<0?.07:d>0?-.1:0;if(d<0)why.push(["info","Fait redescendre"]);}}}
  return {c,s:Math.max(0,Math.min(1,s)),why};}
/* ---------- CHG-01 : suggestions pertinentes, variées, sans répétition ----------
   Mémoire de SESSION (non sauvegardée, vidée à la fermeture) : sons montrés, refusés, mis en pause.
   - refusé (✕)                         → plus proposé pendant la durée de session (réglable)
   - montré dans 3 situations sans être choisi → mis en pause pendant la même durée
   - diversité : pas deux fois le même artiste dans une liste, malus si l’artiste est déjà dans le set
   - s’il ne reste pas assez de sons pertinents, on le dit au lieu de recycler en silence */
const SESS={shown:{},dismissed:{},cool:{},log:[]};
const MIN_PERTINENT=.35,COOL_AFTER=3;
const sessTTL=()=>((S.reco&&S.reco.ttl)||30)*60e3;
const akey=a=>norm(a).trim().split(" ").slice(0,2).join(" ");
function slog(id,t,reason){SESS.log.push({at:Date.now(),id,t,reason});if(SESS.log.length>300)SESS.log.shift();}
function sessExcluded(id){const now=Date.now(),d=SESS.dismissed[id],c=SESS.cool[id];
  if(d&&now-d.at<sessTTL())return "refusé par toi";if(c&&now-c.at<sessTTL())return c.why;return null;}
function markShown(list,ctx,idOf,titleOf){list.forEach(o=>{const id=idOf(o);const sh=SESS.shown[id]=SESS.shown[id]||new Set();
  if(sh.has(ctx))return;sh.add(ctx);if(sh.size>=COOL_AFTER&&!SESS.cool[id]){SESS.cool[id]={at:Date.now(),why:`proposé ${COOL_AFTER} fois sans être choisi`};slog(id,titleOf(o),SESS.cool[id].why);}});}
function dismissSugg(id,title){SESS.dismissed[id]={at:Date.now()};slog(id,title,"refusé par toi");
  pushUndo("refus de la suggestion",()=>{delete SESS.dismissed[id];});toast(`« ${esc(title)} » écarté pour cette session`,true,false,"refus");softRender();}
function otherIdeas(ids){ids.forEach(([id,t])=>{SESS.cool[id]={at:Date.now(),why:"« autres propositions » demandé"};slog(id,t,"autres propositions");});softRender();}
function resetExclusions(silent){const n=Object.keys(SESS.dismissed).length+Object.keys(SESS.cool).length;SESS.dismissed={};SESS.cool={};SESS.shown={};
  if(!silent){toast(n?`${pl(n,"son")} remis dans les propositions`:"Rien à remettre");softRender();}}
const excludedCount=()=>Object.keys(SESS.dismissed).filter(k=>sessExcluded(k)).length+Object.keys(SESS.cool).filter(k=>sessExcluded(k)).length;
function suggestions(){const cur=T(S.cur);if(!cur)return [];
  const inSet=new Set(S.set.ids);
  const base=visible().filter(x=>x.n!==cur.n&&!inSet.has(x.n)&&!x.missing&&!(x.dupOf&&inSet.has(x.dupOf))).filter(x=>!S.sameGenre||x.g===cur.g).filter(x=>!S.keyF||x.k===S.keyF);
  if(!flag("reco2"))return base.map(x=>compat(cur,x)).sort((a,b)=>b.s-a.s).slice(0,5);
  const setArtists=new Set(S.set.ids.map(T).filter(Boolean).map(t=>akey(t.a)));
  const pool=[];for(const x of base){if(sessExcluded("t"+x.n))continue;const r=compat(cur,x);
    if(setArtists.has(akey(x.a))){r.s-=.1;r.why.push(["warn","Artiste déjà dans ton set"]);}pool.push(r);}
  pool.sort((a,b)=>b.s-a.s);const out=[];
  while(out.length<5&&pool.length){let bi=0,bv=-9;
    for(let i=0;i<Math.min(pool.length,60);i++){const p=pool[i];let v=p.s;if(out.some(o=>akey(o.c.a)===akey(p.c.a)))v-=.3;v-=.04*out.filter(o=>o.c.sg===p.c.sg).length;if(v>bv){bv=v;bi=i;}}
    const pick=pool.splice(bi,1)[0];if(pick.s<MIN_PERTINENT)break;out.push(pick);}
  markShown(out,cur.n+"|"+S.set.ids.join(","),o=>"t"+o.c.n,o=>o.c.t);
  return out;}
const scol=s=>s>=.75?"var(--green)":s>=.5?"var(--orange)":"var(--red)";
const verdict=s=>s>=.85?["Parfait","ok"]:s>=.7?["Très bien","ok"]:s>=.5?["Possible","warn"]:["Risqué","bad"];
const ALLKEYS=[];for(let n=1;n<=12;n++)for(const L of ["A","B"])ALLKEYS.push(n+L);
function coverage(){const cnt={};visible().forEach(x=>{if(x.k)cnt[x.k]=(cnt[x.k]||0)+1;});return {cnt,n:ALLKEYS.filter(k=>cnt[k]).length,empty:ALLKEYS.filter(k=>!cnt[k])};}
function onlinePool(){const seen=new Set(),out=[];
  for(const x of [...S.trends.items,...(S.disc.items||[]),...Object.values(S.found||{}),...(S.search.items||[])]){if(!x||seen.has(x.dz))continue;seen.add(x.dz);const c=S.trendCache[x.dz];if(c&&!libMatch(x))out.push({...x,bpm:c.bpm,k:c.k,e:c.e,kSrc:"est"});}
  return out;}
function discoverSugg(){const cur=T(S.cur);if(!cur)return [];
  let l=onlinePool();if(flag("reco2"))l=l.filter(x=>!sessExcluded("dz"+x.dz));
  const out=l.map(x=>compat(cur,x,false)).filter(r=>r.s>=.7).sort((a,b)=>b.s-a.s).slice(0,3);
  if(flag("reco2"))markShown(out,cur.n+"|"+S.set.ids.join(","),o=>"dz"+o.c.dz,o=>o.c.t);return out;}
const jsq=s=>esc(String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"));
function sugRow({c,s,why}){const [w,cl]=verdict(s);const main=[why[0][1],why[1][1],...why.filter(x=>x[0]==="learn").map(x=>x[1])].slice(0,3).join(" · ");const open=S.openWhy===c.n;
  return `<div class="sg"><div class="sc"><span class="tag ${cl}">${w}</span></div>${cover(c)}
    <div class="sgm" onclick="S.openWhy=${open?"null":c.n};softRender()"><div class="sgt"><b>${esc(c.t)}</b> <span class="hint">· ${esc(c.a)}</span></div>${c.wish?'<span class="tag info">à récupérer</span> ':""}<div class="hint sgw">${esc(main)} · <u>${open?"moins":"pourquoi ?"}</u></div>${open?`<div class="why">${why.map(([t,l])=>`<span class="tag ${t}">${esc(l)}</span>`).join("")}</div>`:""}</div>

function wheel(k,cov=coverage()){const cx=120,cy=120,P=(r,a)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
  const seg=(r1,r2,a0,a1)=>{const[x1,y1]=P(r2,a0),[x2,y2]=P(r2,a1),[x3,y3]=P(r1,a1),[x4,y4]=P(r1,a0);return `M${x1},${y1} A${r2},${r2} 0 0 1 ${x2},${y2} L${x3},${y3} A${r1},${r1} 0 0 0 ${x4},${y4}Z`;};
  let o="";
  for(const key of ALLKEYS){const n=kn(key),L=kl(key),a=(n%12)*30-90,[r1,r2]=L==="B"?[78,112]:[44,78];const ks=k?keyS(k,key)[0]:0,isC=key===k,c=cov.cnt[key]||0,[tx,ty]=P((r1+r2)/2,a);
    const empty=!c&&!isC,op=isC?1:empty?.9:ks>=.85?.8:.16;
    o+=`<path d="${seg(r1+1,r2-1,a-14.2,a+14.2)}" fill="${isC?"#fff":empty?"transparent":keyColor(key)}" opacity="${op}" stroke="${empty?keyColor(key):S.keyF===key?"#fff":"none"}" stroke-width="${empty?1.5:2}" ${empty?'stroke-dasharray="3 3"':""}
      onclick="${empty?`findForKey('${key}')`:`S.keyF=S.keyF==='${key}'?null:'${key}';render()`}" data-tip="${key} · ${empty?"aucun son : touche pour en trouver":c+" son"+(c>1?"s":"")}"></path><text x="${tx}" y="${ty+3}" text-anchor="middle" fill="${empty?keyColor(key):op>.5?"#0b0b0d":"#8a8a96"}">${key}</text>`;}
  return `<svg class="wheel" viewBox="0 0 240 240" style="width:100%;max-width:270px;display:block;margin:6px auto">${o}<circle cx="120" cy="120" r="40" fill="var(--panel)"/><text x="120" y="124" text-anchor="middle" fill="#fff" style="font-size:16px;font-weight:800">${k||"?"}</text></svg>`;}

  const p=$("#fkP");if(p)p.style.width="100%";findRefresh();
}

async function exists(dir,name){try{await dir.getFileHandle(name);return true;}catch(e){return false;}}
async function writeFile(dir,name,bytes){const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(bytes);await w.close();}
async function readFile(dir,name){return new Uint8Array(await (await (await dir.getFileHandle(name)).getFile()).arrayBuffer());}
async function backupFile(root,dir,name){const bk=await root.getDirectoryHandle("SetMate sauvegardes",{create:true});const stamp=new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
  await writeFile(bk,stamp+" "+name,await readFile(dir,name));return stamp+" "+name;}
/** Écrit des crates "SetMate%%<nom>.crate" dans <root>/Subcrates. Ne touche jamais une crate qui n’a pas été créée par SetMate. */
async function writeCrates(root,list,volumeTag){
  const sub=await root.getDirectoryHandle("Subcrates",{create:true});const res=[];
  if(!(await exists(sub,"SetMate.crate")))await writeFile(sub,"SetMate.crate",buildCrate([]));
  for(const {name,paths} of list){let file=`SetMate%%${safeName(name)}.crate`;let backup=null;
    const mine=S.created.find(c=>c.file===file&&c.vol===volumeTag);
    if(await exists(sub,file)){if(mine)backup=await backupFile(root,sub,file);else{let i=2;while(await exists(sub,`SetMate%%${safeName(name)} (${i}).crate`))i++;file=`SetMate%%${safeName(name)} (${i}).crate`;}}
    await writeFile(sub,file,buildCrate(paths));
    const back=crateTracks(await readFile(sub,file));if(back.length!==paths.length)throw new Error(`vérification échouée pour ${file}`);
    if(!mine)S.created.push({file,vol:volumeTag,name,date:Date.now(),count:paths.length});else{mine.date=Date.now();mine.count=paths.length;}
    res.push({file,count:paths.length,backup});}
  save();return {sub,res};
}
async function removeCreated(sub,files,vol){for(const f of files){try{await sub.removeEntry(f);}catch(e){}S.created=S.created.filter(c=>!(c.file===f&&c.vol===vol));}save();}

/** Copie des fichiers du set dans un dossier (un fichier manquant ne bloque pas le reste). */
async function copyFiles(dest,items,onStep){const copied=[],lost=[];let skipped=0;
  for(let i=0;i<items.length;i++){const x=items[i];const f=await fileOf(x);if(!f){lost.push(x.t);continue;}
    let same=false;try{const ex=await (await dest.getFileHandle(f.name)).getFile();same=ex.size===f.size;}catch(e){}
    if(!same){const fh=await dest.getFileHandle(f.name,{create:true});const w=await fh.createWritable();await w.write(f);await w.close();}else skipped++;
    copied.push({x,name:f.name});if(onStep)onStep(i,x);}
  return {copied,lost,skipped};}
async function exportFolder(){const items=setFiles();if(!items.length)return;
  if(!FSA){toast("La copie dans un dossier demande Chrome ou Edge.",false,true);return;}

    if(!r.copied.length)throw new Error("aucun fichier du set n’a été trouvé sur ton disque");
    ui.ok(0,`${pl(r.copied.length,"fichier")} dans « ${safeName(S.set.name)} »${r.skipped?` (${r.skipped} déjà présents)`:""}${r.lost.length?` · ${r.lost.length} introuvable${r.lost.length>1?"s":""}`:""}`);
    let n=0;for await(const [k] of dest.entries())n++;ui.ok(1,`Relu : ${pl(n,"fichier")} dans le dossier`);
    ui.end(`<p class="hint mt">Dans Serato, glisse le dossier <b>${esc(safeName(S.set.name))}</b> dans la zone des crates. Vérifie l’ordre des sons, Serato ne le garde pas forcément.</p><div class="row mt" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">OK</button></div>`);}
  catch(e){ui.end(`<p class="mt" style="color:var(--red)">Erreur : ${esc(e.message)}</p><div class="row mt" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Fermer</button></div>`);}}
async function writeRuleCrates(){
  const list=RULES.map((r,i)=>S.crates[i]?{name:r[0],paths:visible().filter(x=>!x.wish).filter(r[1]).map(x=>x.path)}:null).filter(Boolean);
  if(!S.demo&&!(await seratoGate()))return seratoAlternatives("crates");
  const root=await writableSerato();if(!root){list.forEach(c=>download(new Blob([buildCrate(c.paths)]),`SetMate%%${safeName(c.name)}.crate`));if(!S.demo)toast("Crates téléchargées. Mets-les dans Musique › _Serato_ › Subcrates, Serato fermé.");return;}
  if(!(await confirmClosed("Créer les crates dans Serato",`${pl(list.length,"crate")} dans un dossier « SetMate ». Tes crates existantes ne sont pas modifiées.`)))return;
  const ui=stepsUI("Création des crates",["Préparation du dossier Subcrates",...list.map(c=>`« ${c.name} » · ${pl(c.paths.length,"son")}`),"Vérification"]);
  try{ui.run(0);await sleep(150);ui.ok(0);const out=[];for(let i=0;i<list.length;i++){ui.run(i+1);const r=await writeCrates(root,[list[i]],"main");out.push(...r.res);ui.ok(i+1);}
    ui.run(list.length+1);ui.ok(list.length+1,"Relu et vérifié");
    const files=out.filter(r=>!r.backup).map(r=>r.file);const sub=await root.getDirectoryHandle("Subcrates");
    pushUndo("création des crates",()=>removeCreated(sub,files,"main"));

  catch(e){ui.end(`<p class="mt" style="color:var(--red)">Erreur : ${esc(e.message)}. Rien d’autre n’a été modifié.</p><div class="row mt" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Fermer</button></div>`);}
}
async function exportSetCrate(){const items=setFiles();const name=S.set.name;if(!items.length)return;

        let n=0;for await(const [k] of dest.entries())n++;ui.ok(1,`Relu : ${pl(n,"fichier")} dans SetMate/${safeName(S.set.name)}`);
        const g=S.gigs.find(x=>x.id===S.set.gig);if(g){g.check=g.check||{};g.check.usb=true;}save();
        ui.end(`<p class="hint mt">Branche la clé sur ton ordinateur avec Serato, puis glisse le dossier <b>SetMate/${esc(safeName(S.set.name))}</b> dans la zone des crates.</p><div class="row mt" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Terminé</button></div>`);}

function parseCSV(txt){const rows=[];let row=[],cell="",q=false;const sep=(txt.split("\n")[0].match(/;/g)||[]).length>(txt.split("\n")[0].match(/,/g)||[]).length?";":",";
  for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;else if(c===sep){row.push(cell);cell="";}else if(c==="\n"){row.push(cell.replace(/\r$/,""));rows.push(row);row=[];cell="";}else cell+=c;}
  if(cell||row.length){row.push(cell);rows.push(row);}return rows.filter(r=>r.some(c=>c.trim()));}
function matchTrack(title,artist,path){
  if(path){const p=relPath(path);const t=byPath.get(p)||S.tracks.find(x=>x.path.endsWith("/"+p.split("/").pop()));if(t)return t;}
  const bt=baseTitle(title);if(!bt.trim())return null;const cands=S.tracks.filter(x=>baseTitle(x.t)===bt);
  if(cands.length<=1)return cands[0]||null;const a=norm(artist).split(" ")[1]||"";return cands.find(x=>norm(x.a).includes(" "+a))||cands[0];}
function histParse(txt,name,mtime){

  else if(/\.csv$/i.test(name)){const rows=parseCSV(txt);const h=rows[0].map(c=>norm(c).trim());const col=(...ns)=>h.findIndex(c=>ns.some(n=>c===n||c.includes(n)));

  else g=S.gigs.find(x=>x.id===+sel);
  const old=[...g.played];g.played=uniq;markPlayed(g);pushUndo("import d’historique",()=>{g.played=old;});save(true);
  modal(`<h2>Historique importé</h2><p class="mt2"><b>${pl(uniq.length,"son")}</b> reconnu${uniq.length>1?"s":""} et relié${uniq.length>1?"s":""} à « ${esc(g.lieu)} ».</p>${miss.length?`<p class="hint mt2">${pl(miss.length,"ligne")} non reconnue${miss.length>1?"s":""} : ${esc(miss.slice(0,6).join(" · "))}${miss.length>6?"…":""}</p>`:""}

/* ===================== TENDANCES (Deezer, en direct) =====================
   « Du moment » (classements), « Découverte » (flux sans fin de sons peu écoutés de ses styles), recherche libre.
   Le + ajoute le son DANS SA MUSIQUE, marqué « à récupérer » : il sert tout de suite pour préparer un set,
   et se relie tout seul au fichier dès qu’il arrive (Téléchargements ou Serato). */
const SOURCES=[{id:"pl:1109890291",l:"Top France",g:null},{id:"chart:116",l:"Rap / Hip-hop",g:"rap"},{id:"chart:2",l:"Musique africaine",g:"afro"},{id:"chart:165",l:"R&B",g:"rnb"},{id:"pl:5964916564",l:"Amapiano",g:"amapiano"},{id:"chart:132",l:"Pop",g:"pop"}];

function jsonp(url,ms=8000){return new Promise((res,rej)=>{const cb="dz"+Date.now()+Math.floor(Math.random()*1e6),s=document.createElement("script");const clean=()=>{clearTimeout(to);delete window[cb];s.remove();};

  s.src=url+(url.includes("?")?"&":"?")+"output=jsonp&callback="+cb;document.body.appendChild(s);});}
const dzItem=t=>({dz:t.id,t:t.title_short||t.title,a:t.artist?t.artist.name:"",cover:t.album&&t.album.cover_medium,pop:t.rank||0});

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- Lien avec sa musique ---------- */
const WHY={moi:"Ajouté par toi",decouverte:"Pépite ajoutée",tendance:"Tendance ajoutée",soiree:"Demandé en soirée"};

  return S.tracks.find(t=>!t.hidden&&((x.dz&&t.dz===x.dz)||(bt.trim()&&baseTitle(t.t)===bt&&(!a||norm(t.a).includes(" "+a)))))||null;}
function ownedTrend(x){const m=libMatch(x);return !!m&&!m.wish;}          // elle a le fichier
const inWish=x=>{const m=libMatch(x);return !!m&&!!m.wish;};               // dans sa musique, à récupérer
const wishes=()=>S.tracks.filter(t=>t.wish&&!t.hidden&&t.stage!=="done");
const upgrades=()=>S.tracks.filter(t=>t.upgrade&&!t.wish&&!t.hidden);
const ONLINE_G={"Rap / Hip-hop":"rap","Musique africaine":"afrobeats","R&B":"rnb","Amapiano":"amapiano","Pop":"pop"};
function classifyOnline(x){if(x.style)return classify(x.style,x.a);const s=(x.srcs||[]).find(s=>ONLINE_G[s]);return classify(s?ONLINE_G[s]:"",x.a);}

    g,sg,conf:conf||0,gSrc:"en ligne",genreTag:x.style||"",year:null,era:"Actuel",kbps:null,inSerato:false,added:Math.floor(Date.now()/1000),pop:x.pop};
  S.tracks.push(t);reindex();save(true);
  if(!c)analyzeDz(x).then(r=>{if(r&&t.wish){t.bpm=t.bpm||r.bpm;t.k=t.k||r.k;t.e=t.e||r.e;save(true);liveRefresh();}});

async function fetchGenre(t){try{const d=await jsonp(`https://api.deezer.com/track/${t.dz}`);if(!d.album)return;const al=await jsonp(`https://api.deezer.com/album/${d.album.id}`);
  const name=al.genres&&al.genres.data&&al.genres.data[0]&&al.genres.data[0].name;if(!name||t.manual)return;const [g,sg,conf]=classify(name,t.a);

function removeFromLib(t){S.tracks=S.tracks.filter(x=>x!==t);delete S.L[t.n];S.set.ids=S.set.ids.filter(n=>n!==t.n);if(S.cur===t.n)S.cur=S.set.ids[S.set.ids.length-1]||null;reindex();}
function liveRefresh(){renderNav();const a=document.activeElement&&document.activeElement.id;if(!$(".ov")&&a!=="trQ"&&a!=="pickQ"&&["trend","next","home","lib","listen"].includes(S.screen))softRender();}
function findDz(dz){return S.trends.items.find(x=>x.dz===dz)||(S.disc.items||[]).find(x=>x.dz===dz)||(S.disc.extra||[]).find(x=>x.dz===dz)||(S.search.items||[]).find(x=>x.dz===dz)||(S.found||{})[dz]||S.tracks.find(t=>t.dz===dz)||plFind(dz);}

  const di=(S.disc.items||[]).findIndex(y=>y.dz===dz);let repl=null;if(di>=0){repl=pickDisc();S.disc.items.splice(di,1,...(repl?[repl]:[]));}
  pushUndo("ajout à ta musique",()=>{removeFromLib(t);if(di>=0){S.disc.items=S.disc.items.filter(y=>y!==repl);S.disc.items.splice(di,0,x);}});

  const old=kind==="disc"?[...S.disc.items]:null;if(kind==="disc"){S.disc.items=[];refillDisc(30);}

/* ---------- Du moment ---------- */
let trBusy=false;
async function refreshTrends(silent){
  if(trBusy)return;trBusy=true;if(!silent)softRender();
  const agg=new Map();let ok=0;
  for(const s of SOURCES.filter(s=>!s.g||S.genres[s.g])){try{const [k,id]=s.id.split(":");const d=await jsonp(k==="pl"?`https://api.deezer.com/playlist/${id}/tracks?limit=50`:`https://api.deezer.com/chart/${id}/tracks?limit=50`);ok++;
    (d.data||[]).forEach((t,i)=>{const e=agg.get(t.id)||{...dzItem(t),score:0,srcs:[]};e.score+=(51-i)/50;e.srcs.push(s.l);agg.set(t.id,e);});}catch(e){}}
  if(ok){const prev={};S.trends.items.forEach(x=>prev[x.dz]=x.pos);
    const items=[...agg.values()].sort((a,b)=>b.score-a.score).slice(0,40).map((x,i)=>({...x,pos:i+1,prev:prev[x.dz]||null}));
    S.trends={date:Date.now(),items};save();notify(`Nouveautés prêtes : ${items.filter(x=>!libMatch(x)).length} sons que tu n’as pas`,"trend");analyzeQueue(items);}
  else if(!silent)toast("Impossible de joindre Deezer. Vérifie ta connexion internet.",false,true);
  trBusy=false;if(["trend","home","next"].includes(S.screen))liveRefresh();

/* ---------- Découverte : flux sans fin ---------- */
const VARIANTS=()=>{const y=new Date().getFullYear();return [""," "+y," new"," hits"," underground"," mix"," "+(y-1)," club"," vibes"," session"," fresh"," 2000s"];};
async function fetchDiscBatch(style,label){
  S.disc.qi=S.disc.qi||{};S.disc.usedPl=S.disc.usedPl||[];const i=S.disc.qi[style]||0;S.disc.qi[style]=i+1;const v=VARIANTS();
  const pls=await jsonp(`https://api.deezer.com/search/playlist?q=${encodeURIComponent((style+v[i%v.length]).trim())}&limit=12&index=${(Math.floor(i/v.length)%8)*12}`);
  const cand=(pls.data||[]).filter(p=>p.nb_tracks>=15&&!S.disc.usedPl.includes(p.id));if(!cand.length)return [];
  const pl=cand[Math.floor(Math.random()*Math.min(cand.length,6))];S.disc.usedPl.push(pl.id);if(S.disc.usedPl.length>500)S.disc.usedPl.splice(0,100);
  const d=await jsonp(`https://api.deezer.com/playlist/${pl.id}/tracks?limit=100`);
  const seen=new Set(S.disc.seen||[]),popular=new Set(S.trends.items.map(x=>x.dz));
  const out=(d.data||[]).filter(t=>t.preview&&!seen.has(t.id)&&!popular.has(t.id)).map(t=>({...dzItem(t),style:label,peu:(t.rank||0)<PEU_CONNU})).filter(x=>!libMatch(x));
  S.disc.seen=[...(S.disc.seen||[]),...out.map(x=>x.dz)].slice(-5000);return out;}
let discBusy=false,topUpP=null;
/** Remplit la réserve de pépites. Si un remplissage tourne déjà, on attend le même (pas de double appel). */
function topUpExtra(min=40){if(topUpP)return topUpP;const styles=STYLES.filter(([k])=>S.styles[k]);if(!styles.length)return Promise.resolve();
  discBusy=true;topUpP=(async()=>{try{const per=Math.max(8,Math.ceil(min/styles.length));   // chaque style a sa part de la réserve
    for(const [k,l] of shuffle([...styles])){let tries=0;while((S.disc.extra||[]).filter(x=>x.style===l&&!libMatch(x)).length<per&&tries<4){tries++;try{S.disc.extra=[...(S.disc.extra||[]),...shuffle(await fetchDiscBatch(k,l))];}catch(e){}}}}
    finally{discBusy=false;topUpP=null;save();}})();return topUpP;}
function pickDisc(){const ex=S.disc.extra||[];const on=new Set(STYLES.filter(([k])=>S.styles[k]).map(x=>x[1]));
  let pool=ex.filter(x=>on.has(x.style)&&!libMatch(x)&&!(S.disc.items||[]).some(y=>y.dz===x.dz));if(!pool.length){topUpExtra();return null;}
  const peu=pool.filter(x=>x.peu);if(peu.length&&Math.random()<.7)pool=peu;                       // 7 fois sur 10 : un son peu connu
  // varier les styles : on tire d’abord le style le moins présent à l’écran, puis un son au hasard dedans
  const shown={};(S.disc.items||[]).forEach(y=>shown[y.style]=(shown[y.style]||0)+1);const styl=[...new Set(pool.map(y=>y.style))];
  const minC=Math.min(...styl.map(s=>shown[s]||0));const pickS=shuffle(styl.filter(s=>(shown[s]||0)===minC))[0];pool=pool.filter(y=>y.style===pickS);
  const x=pool[Math.floor(Math.random()*pool.length)];S.disc.extra=ex.filter(y=>y!==x);analyzeQueue([x]);if(S.disc.extra.length<25)topUpExtra();return x;}
function refillDisc(n){let k=0;for(let i=0;i<n;i++){const x=pickDisc();if(!x)break;S.disc.items.push(x);k++;}return k;}
async function loadDiscovery(silent){S.disc.items=[];if(!silent)softRender();await topUpExtra(60);refillDisc(30);S.disc.date=Date.now();save();
  if(!S.disc.items.length&&!silent)toast("Pas de pépites trouvées. Vérifie ta connexion ou choisis d’autres styles.",false,true);if(["trend","next","home"].includes(S.screen))liveRefresh();}
async function moreDisc(){let n=refillDisc(15);
  for(let r=0;r<4&&n<15;r++){softRender();await topUpExtra(40);n+=refillDisc(15-n);if(n<15&&r<3)await sleep(2500);}
  save();liveRefresh();
  if(!n)toast(!navigator.onLine?"Pas de réseau : la découverte reprendra dès que tu es connecté.":"Deezer ne m’a rien renvoyé après plusieurs essais. Réessaie dans une minute.",false,true);}

async function analyzeDz(x){if(S.trendCache[x.dz])return S.trendCache[x.dz];

const POS=["a marche","ca marche","bien marche","retourne","kiff","le feu","du feu","tue ","bombe","enorme","valide","propre","chaud","explose","danse","chante","adore","cartonne","parfait","banger","incroyable","de ouf","mortel","garde"];
const NEG=["pas marche","marche pas","flop","vide ","mort ","nul ","rate ","personne ","casse ","ennuy","bof","fuir","fui ","partis","pas pris","pas passe","plombe","rien donne","pas kiffe","eviter"];
const hasAny=(n,l)=>l.some(w=>n.includes(" "+w));
function findTracks(n,pool){let f=pool.filter(t=>{const tt=baseTitle(t.t).trim();return tt.length>=3&&n.includes(" "+tt+" ");});
  if(!f.length)pool.forEach(t=>{const an=norm(t.a).trim().split(" ").slice(0,2).join(" ");if(an.length>=3&&n.includes(" "+an+" ")&&pool.filter(x=>norm(x.a).includes(an)).length===1)f.push(t);});

function analyse(text){const g=S.gigs.find(x=>x.id===S.dGig);const played=g.played.map(T).filter(Boolean);const all=visible();

  sents.forEach(s=>{const n=norm(s);let f=findTracks(n,played);if(!f.length)f=findTracks(n,all);const neg=hasAny(n,NEG),pos=!neg&&hasAny(n,POS),req=/ demand| reclam/.test(n);
    if(f.length>=2&&/ (vers|puis|enchain|transition|apres|sur) /.test(n)){pts.push({type:neg?"pairdown":"pair",a:f[0].n,b:f[1].n,src:s});return;}
    if(req){const tr=S.trends.items.filter(x=>n.includes(baseTitle(x.t)));pts.push({type:"req",ids:f.map(x=>x.n),tr:tr.map(x=>x.dz),src:s});return;}
    if(f.length&&(pos||neg)){f.forEach(t=>pts.push({type:neg?"down":"up",n:t.n,src:s}));return;}
    if(!f.length&&GW.some(([w])=>n.includes(w.startsWith(" ")?w:" "+w))&&/trop|plus de|pas assez|moins|voulai|reclam|manqu|envie/.test(n)){pts.push({type:"rule",text:s,src:s});return;}

function applyDebrief(){const g=S.gigs.find(x=>x.id===S.dGig);const snap=JSON.stringify({L:S.L,P:S.P,r:S.rules,deb:g.deb,notes:g.notes});const addedW=[];

const AU=new Audio();let PL=null,progT=null;const DZC={};
const isPlaying=x=>PL&&PL.u==="t"+x.n;
async function playTrack(n,force=false){const x=T(n);const u="t"+n;if(!force&&PL&&PL.u===u)return stopPlay();if(!force)Q.items=[];stopPlay();PL={u,x,src:"…"};renderPlayer();refreshPlay();
  const f=await fileOf(x);if(PL?.u!==u)return;
  if(f){AU.src=URL.createObjectURL(f);PL.src="ton fichier";}
  else if(x.dz){try{const d=await jsonp(`https://api.deezer.com/track/${x.dz}`);if(PL?.u!==u)return;AU.src=d.preview;PL.src="extrait 30 s · Deezer";}catch(e){previewFail();return stopPlay();}}
  else{const p=await dzSearch(x);if(PL?.u!==u)return;if(!p){toast("Pas d’extrait disponible. Connecte ton dossier Musique pour écouter tes fichiers.",false,true);return stopPlay();}AU.src=p.preview;PL.src="extrait 30 s · Deezer";if(p.cover)x.cover=x.cover||p.cover;}
  try{await AU.play();}catch(e){toast("Lecture impossible : "+esc(e.message),false,true);return stopPlay();}startProg();renderPlayer();refreshPlay();}
async function dzSearch(x){const k=x.a+"|"+x.t;if(k in DZC&&(!DZC[k]||Date.now()-DZC[k].t<8*60e3))return DZC[k];try{const art=String(x.a).split(/,|&| feat/i)[0].trim(),tit=String(x.t).replace(/\(.*\)/,"").trim();
  const d=await jsonp("https://api.deezer.com/search?q="+encodeURIComponent(art+" "+tit)+"&limit=5");const a0=norm(art).trim().split(" ")[0];
  const r=(d.data||[]).find(it=>it.preview&&norm(it.artist?.name).includes(a0)&&norm(it.title).includes(norm(tit).trim().split(" ")[0]));DZC[k]=r?{preview:r.preview,cover:r.album?.cover_medium,t:Date.now()}:null;}catch(e){DZC[k]=null;}return DZC[k];}
async function playDz(dz,force=false,meta=null){const u="dz"+dz;if(!force&&PL&&PL.u===u)return stopPlay();if(!force)Q.items=[];stopPlay();const it=meta||findDz(dz)||{t:"…",a:""};PL={u,x:{dz,t:it.t,a:it.a,cover:it.cover,k:S.trendCache[dz]?.k,bpm:S.trendCache[dz]?.bpm},src:"…"};renderPlayer();refreshPlay();
  try{const d=await jsonp(`https://api.deezer.com/track/${dz}`);if(PL?.u!==u)return;AU.src=d.preview;PL.src="extrait 30 s · Deezer";await AU.play();startProg();}catch(e){previewFail();return stopPlay();}renderPlayer();refreshPlay();}
function startProg(){clearInterval(progT);progT=setInterval(()=>{const b=$("#pbar");if(b&&AU.duration)b.style.width=(AU.currentTime/AU.duration*100)+"%";},250);}
function stopPlay(){AU.pause();clearInterval(progT);if(AU.src.startsWith("blob:"))URL.revokeObjectURL(AU.src);PL=null;renderPlayer();refreshPlay();}
function refreshPlay(){if($(".ov")){if(window.findRefresh)findRefresh();return;}if(S.screen==="lib")libTable();else if(["next","trend","listen"].includes(S.screen))softRender();}

/* ---------- File d’écoute ---------- */
const Q={items:[],i:-1,shuffle:false,repeat:"off",label:"",fails:0,played:new Set()};
const qKey=it=>it.n?"t"+it.n:it.fid?"f"+it.fid:"dz"+it.dz;
const inQueue=()=>!!(Q.items.length&&PL&&Q.items[Q.i]&&PL.u===qKey(Q.items[Q.i]));
let qTok=0;
function qStart(items,i=0,label="",rand=false){Q.items=items.filter(Boolean);Q.label=label;Q.fails=0;Q.played=new Set();
  if(!Q.items.length)return toast("Rien à écouter ici pour l’instant.",false,true);
  if(rand){Q.shuffle=true;i=Math.floor(Math.random()*Q.items.length);}qPlay(Math.min(i,Q.items.length-1));}
async function qPlay(i){if(i<0||i>=Q.items.length)return stopPlay();const tok=++qTok;Q.i=i;Q.played.add(i);const it=Q.items[i];
  if(it.n)await playTrack(it.n,true);else if(it.fid)await playOwn(it.fid,true);else await playDz(it.dz,true,it);
  if(tok!==qTok)return;
  // un extrait indisponible ne bloque pas la file : on passe au suivant (3 essais au plus)
  if(!PL){if(++Q.fails<4&&Q.items.length>1)return qNext();}else Q.fails=0;}
function qPrev(){if(AU.currentTime>3){AU.currentTime=0;return;}qPlay(Math.max(0,Q.i-1));}
function qToggle(){if(!PL){if(Q.items.length)qPlay(Math.max(0,Q.i));return;}if(AU.paused)AU.play().catch(()=>{});else AU.pause();renderPlayer();}
function qRepeat(){Q.repeat=Q.repeat==="off"?"all":Q.repeat==="all"?"one":"off";renderPlayer();toast(Q.repeat==="off"?"Répétition coupée.":Q.repeat==="all"?"Je répète toute la file.":"Je répète ce son.");}
function seekBar(e,el){if(!AU.duration)return;const r=el.getBoundingClientRect();AU.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*AU.duration;}
AU.onplay=AU.onpause=()=>{if(AU.ended)return;if(PL)renderPlayer();else mediaSync();};

/* ---------- Écran verrouillé et écouteurs (Media Session) ---------- */
function mediaSync(){if(!("mediaSession" in navigator))return;const ms=navigator.mediaSession;
  if(!PL){try{ms.metadata=null;ms.playbackState="none";}catch(e){}return;}const x=PL.x;
  try{ms.metadata=new MediaMetadata({title:x.t||"",artist:x.a||"",album:Q.label||"SetMate",
    artwork:x.cover?[{src:x.cover,sizes:"250x250",type:"image/jpeg"}]:[{src:"icon-512.png",sizes:"512x512",type:"image/png"}]});ms.playbackState=AU.paused?"paused":"playing";}catch(e){}}
if("mediaSession" in navigator){const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f);}catch(e){}};
  h("play",()=>{if(PL&&AU.src&&!AU.error){AU.play().catch(()=>{});renderPlayer();}else if(Q.items.length)qPlay(Math.max(0,Q.i));});h("pause",()=>{AU.pause();renderPlayer();});h("stop",()=>stopPlay());
  h("nexttrack",()=>qNext());h("previoustrack",()=>qPrev());h("seekto",d=>{if(d.seekTime!=null)AU.currentTime=d.seekTime;});}

function dbPut(k,v){return new Promise((res,rej)=>{try{const t=DB.db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error||new Error("stockage plein"));}catch(e){rej(e);}});}
function parseName(name){let s=String(name||"").replace(/\.[a-z0-9]{2,4}$/i,"").replace(/_/g," ").replace(/^\s*\d{1,3}\s*[-.)]\s*/,"").trim();
  const p=s.split(/\s+[-–—]\s+/);return p.length>1?{a:p[0].trim(),t:p.slice(1).join(" - ").trim()}:{a:"",t:s};}
function addOwnFiles(){if(!DB.db)return toast("Stockage indisponible dans ce navigateur.",false,true);const i=$("#fileIn");i.accept="audio/*,.mp3,.m4a,.aac,.wav,.aif,.aiff,.flac";i.multiple=true;
  i.onchange=async()=>{const fs=[...i.files];i.value="";i.multiple=false;if(!fs.length)return;
    try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();}catch(e){}
