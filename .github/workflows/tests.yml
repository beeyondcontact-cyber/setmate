name: Tests SetMate

# Lance les tests (Chrome et moteur de Safari) à chaque envoi de code et à chaque proposition de fusion.
# Dépôt public : minutes gratuites. Si le dépôt devient privé : 2 000 minutes gratuites par mois.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - name: Contrôle de sabotage (chaque bug connu doit faire échouer son test)
        run: node tests/sabotage.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preuves-des-echecs
          path: test-results/
          retention-days: 7
