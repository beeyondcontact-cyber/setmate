<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SetMate · Aperçu v2</title>
<style>
:root{
  --bg:#08080a;--win:#0f0f12;--side:#0b0b0e;--panel:#151519;--panel2:#1b1b21;--panel3:#22222a;--line:#26262e;--line2:#30303a;
  --txt:#ececf1;--txt2:#b4b4c0;--muted:#7d7d8a;--blue:#2fa4ff;--blue2:#1a7fd1;--orange:#ff8a1f;--green:#3ddc84;--red:#ff4d5e;--violet:#a77bff;
  --r:12px;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#1a1d2a 0%,var(--bg) 60%);color:var(--txt);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;padding:22px 16px 30px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.btn,.search,.nb,.chip,.pill,.ib,.play,.mic,.mi,.seg button{box-sizing:border-box}
.logo em{font-style:normal;color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.demo{max-width:1280px;margin:0 auto 10px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.demo b{color:var(--orange)}
.window{max-width:1280px;margin:0 auto;background:var(--win);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.02) inset;position:relative}
.titlebar{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;background:linear-gradient(#17171c,#121216);border-bottom:1px solid var(--line)}
.tl{width:12px;height:12px;border-radius:50%}
.titlebar .t{flex:1;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.3px;margin-right:52px}
.app{display:grid;grid-template-columns:220px 1fr;height:min(820px,calc(100vh - 110px));min-height:620px}
/* NAV */
nav{background:var(--side);border-right:1px solid var(--line);padding:16px 10px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:2px 10px 18px;letter-spacing:.3px}
.logo .disc{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 0deg,var(--blue),var(--violet),var(--orange),var(--blue));display:grid;place-items:center;animation:spin 8s linear infinite}
.logo .disc::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--side)}
.logo span{color:var(--blue)}
@keyframes spin{to{transform:rotate(360deg)}}
.nb{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--muted);font-weight:500;position:relative;transition:background .15s,color .15s}
.nb:hover{background:var(--panel);color:var(--txt)}
.nb.on{background:var(--panel2);color:var(--txt)}
.nb.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--blue)}
.nb svg{width:18px;height:18px;flex:none}
.nb .bdg{margin-left:auto;background:var(--orange);color:#111;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
.nb .bdg.blue{background:var(--blue);color:#fff}
.nb .dotr{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,77,94,.2)}
.navsp{flex:1}
.navfoot{font-size:11px;color:var(--muted);padding:10px 11px 2px;border-top:1px solid var(--line);margin-top:6px}
/* COLONNE */
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(15,15,18,.85);backdrop-filter:blur(8px)}
.search{all:unset;cursor:pointer;flex:1;max-width:460px;display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px}
.search:hover{border-color:var(--line2)}
.search kbd,.kbd{margin-left:auto;font:11px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.tsp{flex:1}
.pill{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.pill.warn i{background:var(--orange);box-shadow:0 0 0 3px rgba(255,138,31,.2)}
.ib{all:unset;cursor:pointer;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);position:relative}
.ib:hover{border-color:var(--line2)}
.ib[disabled]{opacity:.35;cursor:default}
.ib svg{width:17px;height:17px}
.ib .n{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
main{flex:1;overflow:auto;padding:22px 24px 30px;scroll-behavior:smooth}
.screen{animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
h1{font-size:24px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:2px 0 18px;font-size:13px}
h3{font-size:14px;margin-bottom:2px}
.hint{color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.hi{background:linear-gradient(135deg,rgba(47,164,255,.12),rgba(167,123,255,.06) 60%,var(--panel));border-color:#28415e}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g-lib{grid-template-columns:1fr 310px}.g-next{grid-template-columns:1fr 300px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:14px}.mt2{margin-top:8px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;background:var(--blue);color:#fff;font-weight:600;font-size:13px;transition:filter .15s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt)}
.btn.orange{background:var(--orange);color:#140b00}
.btn.green{background:var(--green);color:#04210f}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{all:unset;cursor:pointer;padding:5px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-size:12px;transition:.15s}
.chip:hover{color:var(--txt)}
.chip.on{border-color:var(--blue);color:var(--txt);background:rgba(47,164,255,.13)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:7px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--panel3);color:var(--txt);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
input.f,select.f,textarea.f{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 11px;font:inherit;font-size:13px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--blue)}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:9px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1;white-space:nowrap}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--txt)}
.tbl td{padding:7px 8px;border-bottom:1px solid #1d1d24;vertical-align:middle}
.tbl tr.r{cursor:pointer;transition:background .12s}
.tbl tr.r:hover td{background:#1a1a20}
.tbl tr.sel td{background:rgba(47,164,255,.09)}
.tw{max-height:520px;overflow:auto;border-radius:var(--r)}
.tt{display:flex;align-items:center;gap:10px;min-width:0}
.tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.tt small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.cv{width:36px;height:36px;border-radius:7px;flex:none;display:grid;place-items:center;font-weight:800;font-size:12px;color:rgba(0,0,0,.65);background-size:cover;background-position:center;position:relative;overflow:hidden}
.cv.lg{width:64px;height:64px;font-size:20px;border-radius:10px}
.cv.xl{width:84px;height:84px;font-size:26px;border-radius:12px}
.key{display:inline-block;min-width:36px;text-align:center;padding:2px 6px;border-radius:5px;font-weight:800;font-size:12px;color:#0b0b0d}
.nrg{display:inline-block;width:56px;height:6px;border-radius:3px;background:#262630;vertical-align:middle;overflow:hidden}
.nrg i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--orange))}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:5px;background:#24242c;color:#c9c9d3;white-space:nowrap}
.tag.ok{background:rgba(61,220,132,.13);color:var(--green)}
.tag.warn{background:rgba(255,138,31,.14);color:var(--orange)}
.tag.bad{background:rgba(255,77,94,.14);color:var(--red)}
.tag.info{background:rgba(47,164,255,.14);color:var(--blue)}
.tag.learn{background:rgba(167,123,255,.15);color:var(--violet)}
.conf{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle}
.play{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;flex:none;background:var(--panel3);border:1px solid var(--line2);display:grid;place-items:center;transition:.15s}
.play:hover{background:var(--blue);border-color:var(--blue)}
.play.on{background:var(--orange);border-color:var(--orange)}
.play svg{width:12px;height:12px}
/* ACCUEIL */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:28px}
.big{font-size:22px;font-weight:800;letter-spacing:-.3px}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #22222a;cursor:pointer}
.ck:last-child{border:0}
.ck .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;transition:.2s}
.ck.done .bx{background:var(--green);border-color:var(--green)}
.ck.done span{color:var(--muted);text-decoration:line-through}
.ck .go{margin-left:auto;color:var(--muted);font-size:12px}
.ring{width:64px;height:64px;flex:none}
.mini{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #22222a}
.mini:last-child{border:0}
.stat{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #22222a;cursor:pointer}
.stat:last-child{border:0}
.stat b{font-size:16px}
.bars .br{display:grid;grid-template-columns:90px 1fr 30px;gap:10px;align-items:center;margin:7px 0;font-size:12px;color:var(--txt2)}
.bars .tr{height:10px;background:#1f1f27;border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0}
.hist{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.hist .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.hist .c i{display:block;width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px;transition:filter .15s}
.hist .c:hover i{filter:brightness(1.3)}
.hist .c span{font-size:10px;color:var(--muted)}
/* SON SUIVANT */
.now{display:flex;align-items:center;gap:16px}
.wave{flex:1;height:52px;display:flex;align-items:center;gap:2px;overflow:hidden;min-width:80px}
.wave i{flex:1;border-radius:2px;background:linear-gradient(var(--blue),#1b5f99)}
.sg{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);margin-top:8px;transition:border-color .15s,transform .15s}
.sg:hover{border-color:var(--line2);transform:translateX(2px)}
.sc{width:48px;flex:none;text-align:center}
.sc b{font-size:18px;font-weight:800}
.sc .bar{height:4px;border-radius:2px;background:#2a2a33;margin-top:3px;overflow:hidden}
.sc .bar i{display:block;height:100%}
.why{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.setrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);margin-top:6px}
.setrow .n{width:20px;color:var(--blue);font-weight:800;text-align:center}
.trn{display:flex;justify-content:center;margin:-2px 0 -2px 30px}
.trn span{font-size:10px;padding:1px 8px;border-radius:9px}
.mi{all:unset;cursor:pointer;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.mi:hover{background:var(--panel3);color:var(--txt)}
.wheel text{font-size:9px;font-weight:700;pointer-events:none}
.wheel path{cursor:pointer;transition:opacity .2s}
.wheel path:hover{opacity:.85}
.drop{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;max-height:280px;overflow:auto;z-index:20;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.drop div{padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:10px}
.drop div:hover{background:var(--panel3)}
/* TENDANCES */
.trend{display:grid;grid-template-columns:34px 40px 1fr auto auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid #20202a}
.rank{font-weight:800;font-size:18px;color:var(--txt2);text-align:center;line-height:1}
.rank small{display:block;font-size:10px;margin-top:3px}
.place{font-size:11px;color:var(--muted);margin-top:3px}
.place b{color:var(--txt2);font-weight:600}
.src{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line2);color:var(--muted);margin-right:3px}
/* DEBRIEF */
.mic{all:unset;cursor:pointer;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;margin:14px auto 8px;
  background:radial-gradient(circle at 35% 30%,#ff7180,#c5172d);box-shadow:0 0 0 10px rgba(255,77,94,.10),0 0 0 22px rgba(255,77,94,.05),0 18px 40px rgba(200,20,40,.35);transition:transform .15s}
.mic:hover{transform:scale(1.04)}
.mic.rec{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(255,77,94,.22),0 0 0 36px rgba(255,77,94,.08),0 18px 40px rgba(200,20,40,.35)}}
.mic svg{width:48px;height:48px}
.lvl{display:flex;gap:3px;justify-content:center;height:22px;align-items:center;margin-bottom:4px}
.lvl i{width:4px;border-radius:2px;background:var(--red);height:4px;transition:height .1s}
.mic.rec ~ .lvl i{animation:lv .6s infinite alternate}
@keyframes lv{to{height:20px}}
.guide{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.guide span{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--txt2)}
textarea.f{width:100%;min-height:110px;resize:vertical;line-height:1.55}
.pt{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #22222a;animation:fade .3s var(--ease) both}
.pt input{accent-color:var(--green);width:17px;height:17px;margin-top:2px;flex:none}
.pt q{display:block;color:var(--muted);font-size:12px;margin-top:3px;font-style:italic}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.empty svg{width:40px;height:40px;opacity:.4;margin-bottom:8px}
/* PLAYER */
.player{display:flex;align-items:center;gap:12px;padding:9px 18px;border-top:1px solid var(--line);background:linear-gradient(#111116,#0d0d11)}
.player .info{min-width:0;flex:0 1 260px}
.player .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.player .info small{color:var(--muted);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{flex:1;height:5px;background:#24242c;border-radius:3px;overflow:hidden;cursor:default}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--orange))}
.beat{width:10px;height:10px;border-radius:50%;background:#2a2a33;flex:none}
.beat.on{background:var(--orange);box-shadow:0 0 12px var(--orange)}
/* OVERLAYS */
.ov{position:fixed;inset:0;background:rgba(5,5,8,.72);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:16px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px;width:min(520px,100%);box-shadow:0 40px 100px rgba(0,0,0,.6);animation:pop .25s var(--ease);max-height:90vh;overflow:auto}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal h2{font-size:19px;margin-bottom:4px}
.step{display:flex;align-items:center;gap:10px;padding:7px 0;color:var(--muted)}
.step.done{color:var(--txt)}
.step .st{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:11px;flex:none}
.step.done .st{background:var(--green);border-color:var(--green);color:#04210f}
.step.run .st{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.prog{height:8px;background:#22222a;border-radius:4px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .2s}
.pal{width:min(600px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6);align-self:start;margin-top:12vh;animation:pop .2s var(--ease)}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 18px;color:var(--txt);font-size:16px;outline:none}
.pal .res{max-height:360px;overflow:auto;padding:6px}
.pal .it{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer}
.pal .it.on{background:var(--panel3)}
.pal .it small{margin-left:auto;color:var(--muted);font-size:11px}
.notif{position:absolute;top:52px;right:18px;width:330px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 30px 70px rgba(0,0,0,.55);z-index:40;padding:6px;animation:pop .2s var(--ease)}
.notif .it{display:flex;gap:10px;padding:10px;border-radius:8px;cursor:pointer}
.notif .it:hover{background:var(--panel2)}
.notif .it i{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px;flex:none}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center;width:max-content;max-width:92vw}
.toast{background:#1c2633;border:1px solid #2f5d86;color:#fff;padding:10px 12px 10px 16px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop .25s var(--ease)}
.toast button{all:unset;cursor:pointer;color:var(--blue);font-weight:700;padding:2px 6px}
.tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--line2);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;z-index:70;opacity:0;transition:opacity .1s;max-width:240px}
.onb{text-align:center}
.onb .disc{width:76px;height:76px;margin:6px auto 14px;border-radius:50%;background:conic-gradient(from 0deg,var(--blue),var(--violet),var(--orange),var(--blue));display:grid;place-items:center;animation:spin 6s linear infinite}
.onb .disc::after{content:"";width:20px;height:20px;border-radius:50%;background:var(--panel)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.dots i.on{background:var(--blue);width:20px;border-radius:4px}
.counter{font-size:30px;font-weight:800;letter-spacing:-.5px}
@media (max-width:980px){
  .g-lib,.g-next{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  body{padding:10px 6px}

/* ============ SON SUIVANT ============ */
function pitch(a,b){
  let best=[[b,""],[b*2,"double"],[b/2,"moitié"]].map(([v,m])=>({v,m,d:Math.abs(v-a)})).sort((x,y)=>x.d-y.d)[0];
  const pct=(best.v-a)/a*100,ap=Math.abs(pct);
  const s=ap<=2?1:ap>=8?0:1-(ap-2)/6;
  const diff=Math.round(b-a);
  const lab=best.m?`BPM ${best.m} (${b})`:(diff===0?"Même BPM":`${diff>0?"+":""}${diff} BPM`);
  return {s,lab,pct};
}
function keyS(a,b){
  const d=(kn(b)-kn(a)+12)%12;
  if(a===b)return[1,"Même tonalité"];
  if(kn(a)===kn(b))return[.85,"Tonalité relative"];
  if((d===1||d===11)&&kl(a)===kl(b))return[.9,"Tonalité voisine"];
  if(d===2&&kl(a)===kl(b))return[.6,"+2 · boost d’énergie"];
  if(d===7&&kl(a)===kl(b))return[.5,"+7 · changement marqué"];
  return[.15,"Tonalité éloignée"];
}
const GW=[["amapiano",x=>x.sg==="Amapiano","amapiano"],["afrobeat",x=>x.sg==="Afrobeats","afrobeats"],["afro",x=>x.g==="Afro","afro"],["rap",x=>x.sg.startsWith("Rap"),"rap"],["drill",x=>x.sg==="Drill","drill"],[" r b ",x=>x.g==="R&B","R&B"],["rnb",x=>x.g==="R&B","R&B"],["dancehall",x=>x.sg==="Dancehall","dancehall"],["kompa",x=>x.sg==="Kompa","kompa"],["hits",x=>x.g==="Open format","hits"],["shatta",x=>x.sg==="Shatta"||x.sg==="Dancehall","shatta"]];
function ruleEffects(){
  const ef=[];
  S.rules.forEach(r=>{const n=norm(r);GW.forEach(([w,f,l])=>{const i=n.indexOf(w.startsWith(" ")?w:" "+w);if(i<0)return;const pre=n.slice(Math.max(0,i-24),i);
    let sgn=0;if(/trop|moins/.test(pre))sgn=-1;else if(/plus|voulai|reclam|demand|assez|manqu|envie/.test(pre))sgn=1;if(sgn&&!ef.some(e=>e.l===l))ef.push({f,sgn,l});});});
  return ef;
}
function compat(cur,c,full=true){
  const p=pitch(cur.bpm,c.bpm),[ks,kl2]=keyS(cur.k,c.k);
  const fresh=c.d<14?.25:1;
  let s=.4*p.s+.4*ks+.2*fresh;const why=[];
  why.push([p.s>.75?"ok":p.s>.3?"warn":"bad",p.lab+(Math.abs(p.pct)>=.5&&!p.lab.startsWith("BPM ")?` · pitch ${p.pct>0?"+":""}${p.pct.toFixed(1).replace(".",",")} %`:"")]);
  why.push([ks>=.85?"ok":ks>=.5?"warn":"bad",kl2]);
  why.push(c.d<14?["warn",`Joué il y a ${c.d} j`]:["ok",c.d>500?"Jamais joué":`Pas joué depuis ${c.d} j`]);
  if(full){
    if(S.L[c.id]){s+=S.L[c.id].v;why.push(["learn",S.L[c.id].why]);}
    const pk=cur.id+">"+c.id;if(S.P[pk]){s+=S.P[pk].v;why.push(["learn",S.P[pk].why]);}
    ruleEffects().forEach(e=>{if(e.f(c)){s+=e.sgn*.08;why.push(["learn",`Règle : ${e.sgn>0?"plus":"moins"} ${de(e.l)}`]);}});
    if(S.dir!=="any"){const de=c.e-cur.e;
      if(S.dir==="up"){s+=de>0?.07:de<0?-.1:0;if(de>0)why.push(["info","Monte l’énergie"]);}
      if(S.dir==="keep"){s+=Math.abs(de)<=1?.06:-.06;if(Math.abs(de)<=1)why.push(["info","Garde l’énergie"]);}
      if(S.dir==="down"){s+=de<0?.07:de>0?-.1:0;if(de<0)why.push(["info","Fait redescendre"]);}}
  }
  return {c,s:Math.max(0,Math.min(1,s)),why};
}
function suggestions(){
  const cur=byId(S.cur);
  return T.filter(x=>x.id!==cur.id&&!S.set.includes(x.id)&&!S.hidden[x.id])
    .filter(x=>!S.sameGenre||x.g===cur.g).filter(x=>!S.keyF||x.k===S.keyF)
    .map(x=>compat(cur,x)).sort((a,b)=>b.s-a.s).slice(0,5);
}

        <div class="sc"><b style="color:${scol(s)}">${Math.round(s*100)}</b><div class="bar"><i style="width:${s*100}%;background:${scol(s)}"></i></div></div>
        ${cover(c)}<div style="flex:1;min-width:0"><b>${esc(c.t)}</b> <span class="hint">· ${esc(c.a)} · ${c.bpm} BPM</span> ${keyTag(c.k)}
        <div class="why">${why.map(([t,l])=>`<span class="tag ${t}">${l}</span>`).join("")}</div></div>
        <button class="play" onclick="playObj(byId(${c.id}))" aria-label="Écouter">${svg(isPlaying(c)?"pause":"play",12)}</button>
        <button class="btn sm" onclick="addSet(${c.id})">${svg("plus",13)}Set</button></div>`).join("")
       :`<div class="empty">Aucun son avec ces filtres. Enlève un filtre.</div>`}
    </div>

      <div class="row" style="gap:12px;justify-content:center;font-size:11px;color:var(--muted)"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#fff;margin-right:4px"></i>Ton son</span><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:linear-gradient(90deg,#7fd17f,#e07fd1);margin-right:4px"></i>En couleur : compatible</span><span>Sombre : à éviter</span></div></div>

function wheel(k){
  const cx=120,cy=120,P=(r,a)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
  const seg=(r1,r2,a0,a1)=>{const[x1,y1]=P(r2,a0),[x2,y2]=P(r2,a1),[x3,y3]=P(r1,a1),[x4,y4]=P(r1,a0);return `M${x1},${y1} A${r2},${r2} 0 0 1 ${x2},${y2} L${x3},${y3} A${r1},${r1} 0 0 0 ${x4},${y4}Z`;};
  let o="";
  for(let n=1;n<=12;n++)for(const L of["A","B"]){
    const key=n+L,a=(n%12)*30-90,[r1,r2]=L==="B"?[78,112]:[44,78];
    const ks=keyS(k,key)[0],isC=key===k,cnt=T.filter(x=>x.k===key&&!S.hidden[x.id]).length;
    const op=isC?1:ks>=.85?.75:.13;
    const [tx,ty]=P((r1+r2)/2,a);
    o+=`<path d="${seg(r1+1,r2-1,a-14.2,a+14.2)}" fill="${isC?"#fff":keyColor(key)}" opacity="${op}" stroke="${S.keyF===key?"#fff":"none"}" stroke-width="2" onclick="S.keyF=S.keyF==='${key}'?null:'${key}';render()" data-tip="${key} · ${cnt} son${cnt>1?"s":""}${ks>=.85&&!isC?" · compatible":""}"></path><text x="${tx}" y="${ty+3}" text-anchor="middle" fill="${op>.5?"#0b0b0d":"#9a9aa6"}">${key}</text>`;
  }
  return `<svg class="wheel" viewBox="0 0 240 240" style="width:100%;max-width:260px;display:block;margin:6px auto">${o}<circle cx="120" cy="120" r="40" fill="var(--panel)"/><text x="120" y="117" text-anchor="middle" fill="#fff" style="font-size:16px;font-weight:800">${k}</text><text x="120" y="132" text-anchor="middle" fill="#7d7d8a" style="font-size:9px;font-weight:500">ton son</text></svg>`;
}
function setPanel(){
  const items=S.set.map(byId);
  const mins=Math.round(items.length*3.4);
  const W=280,H=56,pts=items.map((x,i)=>[items.length>1?10+i*(W-20)/(items.length-1):W/2,H-8-(x.e-1)/9*(H-16)]);
  const spark=items.length?`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:340px;height:${H}px">
    <line x1="0" y1="${H-4}" x2="${W}" y2="${H-4}" stroke="#2a2a33"/>
    ${items.length>1?`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linejoin="round"/>`:""}
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--orange)" stroke="var(--panel)" stroke-width="2" data-tip="${i+1}. ${esc(items[i].t)} · énergie ${items[i].e}/10"/>`).join("")}</svg>`:"";
  return `<div class="card mt"><div class="row between"><div class="row" style="gap:8px"><h3>Set en cours</h3><input class="f" value="${esc(S.setName)}" onchange="S.setName=this.value" style="padding:4px 8px;font-size:12px;width:190px" aria-label="Nom du set"></div>
    <div class="row" style="gap:8px"><button class="btn ghost sm" onclick="clearSet()">Vider</button><button class="btn sm" onclick="exportCrate()">Crate Serato</button><button class="btn orange sm" onclick="exportUsb()">${svg("usb",14)}Copier sur clé USB</button></div></div>
    <div class="row mt2" style="gap:18px"><span class="hint"><b style="color:var(--txt)">${items.length}</b> sons · ≈ <b style="color:var(--txt)">${mins} min</b> · BPM ${Math.min(...items.map(x=>x.bpm))} à ${Math.max(...items.map(x=>x.bpm))}</span><span class="hint">Courbe d’énergie :</span></div>
    ${spark}
    <div>${items.map((x,i)=>{let tr="";if(i>0){const c=compat(items[i-1],x,false);tr=`<div class="trn"><span class="tag ${c.s>=.75?"ok":c.s>=.5?"warn":"bad"}" data-tip="${c.why.map(w=>w[1]).join(" · ")}">${c.s>=.5?"✓":"⚠"} transition ${Math.round(c.s*100)}</span></div>`;}
      return tr+`<div class="setrow"><span class="n">${i+1}</span>${cover(x)}<div style="flex:1;min-width:0"><b>${esc(x.t)}</b> <span class="hint">· ${esc(x.a)}</span></div><span class="hint hm">${x.bpm}</span>${keyTag(x.k)}
      <button class="mi" onclick="mv(${i},-1)" aria-label="Monter" ${i===0?"disabled":""}>${svg("up",14)}</button><button class="mi" onclick="mv(${i},1)" aria-label="Descendre">${svg("down",14)}</button><button class="mi" onclick="rmSet(${i})" aria-label="Retirer">${svg("x",14)}</button></div>`}).join("")}</div></div>`;
}

function micToggle(){

const POS=["a marche","ca marche","bien marche","retourne","kiff","le feu","du feu","tue ","bombe","enorme","valide","propre","chaud","explose","danse","chante","adore","cartonne","parfait","banger","incroyable","de ouf","mortel","garde"];
const NEG=["pas marche","marche pas","flop","vide ","mort ","nul ","rate ","personne ","casse ","ennuy","bof","fuir","fui ","partis","pas pris","pas passe","plombe","rien donne","pas kiffe","eviter"];
function hasAny(n,l){return l.some(w=>n.includes(" "+w));}
function findTracks(n,pool){
  let f=pool.filter(t=>{const tt=norm(t.t).trim();return tt.length>=3&&n.includes(" "+tt+" ");});
  if(!f.length){pool.forEach(t=>{const an=norm(t.a).trim().split(" ").slice(0,2).join(" ");if(an.length>=3&&n.includes(" "+an+" ")&&pool.filter(x=>norm(x.a).includes(an)).length===1)f.push(t);});}
  return f.sort((a,b)=>n.indexOf(norm(a.t).trim())-n.indexOf(norm(b.t).trim()));
}
function analyse(text){
  const g=S.gigs.find(x=>x.id===S.dGig);
  const pool=T.filter(t=>!S.hidden[t.id]);
  const sents=text.replace(/\b(par contre|mais|et puis|ensuite)\b/gi,". ").split(/[.!?;\n]+/).map(s=>s.trim()).filter(s=>s.length>3);
  const pts=[];
  sents.forEach(s=>{
    const n=norm(s);const f=findTracks(n,pool);const neg=hasAny(n,NEG),pos=!neg&&hasAny(n,POS);const req=/ demand| reclam/.test(n);
    if(f.length>=2&&/ (vers|puis|enchain|transition|apres|sur) /.test(n)){pts.push({type:neg?"pairdown":"pair",a:f[0].id,b:f[1].id,src:s});return;}
    if(req){const tr=TR.filter(x=>n.includes(" "+norm(x.t).trim()+" "));pts.push({type:"req",tr:tr.map(x=>x.i),ids:f.map(x=>x.id),src:s});return;}
    if(f.length&&(pos||neg)){f.forEach(t=>pts.push({type:neg?"down":"up",id:t.id,src:s}));return;}
    if(!f.length&&GW.some(([w])=>n.includes(w.startsWith(" ")?w:" "+w))&&/trop|plus de|pas assez|moins|voulai|reclam|manqu|envie/.test(n)){pts.push({type:"rule",text:s,src:s});return;}
    if(f.length){f.forEach(t=>pts.push({type:"unsure",id:t.id,src:s}));return;}
    if(pos||neg)pts.push({type:"mood",neg,src:s});
  });
  pts.forEach(p=>p.on=p.type!=="unsure");
  return pts;
}
function runAnalyse(){S.dPts=analyse(S.dTxt||"");render();}
function ptsHtml(){
  if(!S.dPts)return `<div class="empty">${svg("debrief",40)}<div>Raconte ta soirée, je m’occupe du reste.</div></div>`;

  return S.dPts.map((p,i)=>{
    let tag="",txt="";

    if(p.type==="pairdown"){tag='<span class="tag bad">Enchaînement</span>';txt=`<b>${esc(byId(p.a).t)} → ${esc(byId(p.b).t)}</b> raté → je l’éviterai`;}
    if(p.type==="rule"){const ef=ruleEffectsOf(p.text);tag='<span class="tag learn">Règle</span>';txt=`Pour les soirées ${g.type.toLowerCase()} : ${ef.length?ef.map(e=>`<b>${e.sgn>0?"plus":"moins"} ${de(e.l)}</b>`).join(", "):"<b>noté</b>"}`;}
    if(p.type==="req"){tag='<span class="tag info">Demande</span>';txt=p.tr.length?`<b>${esc(TR[p.tr[0]].t)}</b> demandé par le public${owned(TR[p.tr[0]])?" → tu l’as déjà, je le remonte":S.todo.some(t=>t.t===TR[p.tr[0]].t)?" → déjà dans « À récupérer », je le marque prioritaire":" → ajouté à « À récupérer »"}`:`Demande du public notée`;}
    if(p.type==="unsure"){tag='<span class="tag warn">À préciser</span>';txt=`Tu parles de <b>${esc(byId(p.id).t)}</b>, mais je n’ai pas compris si ça a marché. <span class="row mt2" style="gap:6px"><button class="btn sm green" onclick="fix(${i},'up')">A marché</button><button class="btn sm" style="background:var(--red)" onclick="fix(${i},'down')">Flop</button></span>`;}
    if(p.type==="mood"){tag=`<span class="tag ${p.neg?"warn":"ok"}">Ambiance</span>`;txt=`Ambiance générale ${p.neg?"difficile":"au top"} → notée dans l’historique de la soirée`;}
    return `<label class="pt" style="animation-delay:${i*.06}s"><input type="checkbox" ${p.on?"checked":""} onchange="S.dPts[${i}].on=this.checked" ${p.type==="unsure"?"disabled":""}><div style="flex:1">${tag}<div class="mt2">${txt}</div><q>${esc(p.src)}</q></div></label>`;
  }).join("");
}
function ruleEffectsOf(t){const o=S.rules;S.rules=[t];const e=ruleEffects();S.rules=o;return e;}
function fix(i,t){S.dPts[i].type=t;S.dPts[i].on=true;$("#pts").innerHTML=ptsHtml();}
function applyDebrief(){
  const g=S.gigs.find(x=>x.id===S.dGig);
  const snap=JSON.stringify({L:S.L,P:S.P,r:S.rules,todo:S.todo,deb:g.deb});
  const on=S.dPts.filter(p=>p.on&&p.type!=="unsure");
  on.forEach(p=>{
    if(p.type==="up")S.L[p.id]={v:.12,why:`▲ A marché (${g.label})`};
    if(p.type==="down")S.L[p.id]={v:-.3,why:`▼ Flop en ${g.type.toLowerCase()} (${g.label})`};
    if(p.type==="pair")S.P[p.a+">"+p.b]={v:.18,why:"▲ Enchaînement validé"};
    if(p.type==="pairdown")S.P[p.a+">"+p.b]={v:-.3,why:"▼ Enchaînement raté"};
    if(p.type==="rule")S.rules.push(p.text);
    if(p.type==="req")p.tr.forEach(i=>{const x=TR[i];if(!owned(x)&&!S.todo.some(t=>t.t===x.t))S.todo.push({t:x.t,a:x.a,why:"Demandé en soirée"});else{const t=S.todo.find(t=>t.t===x.t);if(t)t.why="Tendance · demandé en soirée";}});
  });
  g.deb={n:on.length};
  pushUndo("application du débrief",()=>{const o=JSON.parse(snap);S.L=o.L;S.P=o.P;S.rules=o.r;S.todo=o.todo;g.deb=o.deb;});
  S.dPts=null;S.dTxt="";
  notify(`Débrief du ${g.label} appliqué : ${on.length} points retenus`,"home");
  go("home");toast(`Débrief appliqué : ${on.length} points retenus. Tes suggestions ont changé.`,true);
}

const AU=new Audio();let PL=null,AC=null,pulseT=null,progT=null;
function isPlaying(x){return PL&&PL.u===uid(x);}
function jsonp(url,ms=4500){return new Promise((res,rej)=>{const cb="dz"+Date.now()+Math.floor(Math.random()*1e5),s=document.createElement("script");
  const clean=()=>{clearTimeout(to);delete window[cb];s.remove();};const to=setTimeout(()=>{clean();rej("timeout")},ms);
  window[cb]=d=>{clean();res(d)};s.onerror=()=>{clean();rej("err")};s.src=url+"&output=jsonp&callback="+cb;document.body.appendChild(s);});}
async function findPreview(x){
  const u=uid(x);if(u in DZ)return DZ[u];
  try{const art=x.a.split(",")[0].trim(),tit=x.t.replace(/\(.*\)/,"").trim();
    const d=await jsonp("https://api.deezer.com/search?q="+encodeURIComponent(art+" "+tit)+"&limit=5");
    const a0=norm(art).trim().split(" ")[0];
    const r=(d&&d.data||[]).find(it=>it.preview&&norm(it.artist&&it.artist.name).includes(a0)&&norm(it.title).includes(norm(tit).trim().split(" ")[0]));
    DZ[u]=r?{preview:r.preview,cover:r.album&&r.album.cover_medium}:null;}
  catch(e){DZ[u]=null;}
  return DZ[u];
}
async function playObj(x){
  const u=uid(x);if(PL&&PL.u===u){stopPlay();return;}
  stopPlay();PL={u,x,mode:"load",t0:Date.now()};renderPlayer();refreshPlayBtns();
  const p=await findPreview(x);if(!PL||PL.u!==u)return;
  if(p){AU.src=p.preview;try{await AU.play();PL.mode="dz";}catch(e){PL.mode="pulse";startPulse(x.bpm);}}
  else{PL.mode="pulse";startPulse(x.bpm);}
  PL.t0=Date.now();renderPlayer();refreshPlayBtns();
  clearInterval(progT);progT=setInterval(()=>{if(!PL)return;const t=PL.mode==="dz"?AU.currentTime:(Date.now()-PL.t0)/1000;const b=$("#pbar");if(b)b.style.width=Math.min(100,t/30*100)+"%";if(t>=30)stopPlay();},200);
}
AU.onended=()=>stopPlay();
function startPulse(bpm){
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();let n=0;
  const beat=()=>{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.26);
    const h=AC.createOscillator(),hg=AC.createGain();h.type="square";h.frequency.value=8000;hg.gain.setValueAtTime(n%2?.04:.02,t+30/bpm);hg.gain.exponentialRampToValueAtTime(.0001,t+30/bpm+.04);h.connect(hg).connect(AC.destination);h.start(t+30/bpm);h.stop(t+30/bpm+.05);
    const bt=$("#beat");if(bt){bt.classList.add("on");setTimeout(()=>bt.classList.remove("on"),90);}n++;};
  beat();pulseT=setInterval(beat,60000/bpm);
}
function stopPlay(){AU.pause();clearInterval(pulseT);clearInterval(progT);PL=null;renderPlayer();refreshPlayBtns();}

  if(typing)return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){e.preventDefault();doUndo();}
  if(e.code==="Space"&&!$(".ov")){e.preventDefault();if(PL)stopPlay();else if(S.screen==="next")playObj(byId(S.cur));}
});
document.addEventListener("click",e=>{if(!e.target.closest(".notif")&&!e.target.closest("#bellBtn"))closeNotif();});

/* ============ PREMIÈRE OUVERTURE ============ */
function onboarding(step=0){
  const dots=`<div class="dots">${[0,1,2].map(i=>`<i class="${i===step?"on":""}"></i>`).join("")}</div>`;
  if(step===0)modal(`<div class="onb"><div class="disc"></div><h2>Bienvenue dans SetMate</h2><p class="hint mt2">Ton assistant qui range ta musique, te souffle le son suivant, surveille les tendances et apprend de tes soirées.</p>
    <input class="f mt" id="onbN" placeholder="Ton prénom (facultatif)" style="width:100%;text-align:center" value="${esc(S.name)}">
    <button class="btn block mt" onclick="S.name=$('#onbN').value.trim();onboarding(1)">C’est parti</button><button class="btn ghost block mt2" onclick="closeModal();render()">Passer</button>${dots}</div>`,true);
  if(step===1)modal(`<div class="onb"><h2>Je trouve tes sons</h2><p class="hint mt2">Je lis d’abord ce que Serato a déjà analysé. Je n’analyse que ce qui manque.</p>
    <div class="mt" style="text-align:left">${["Serato DJ détecté","Dossier ~/Music/DJ","Clé USB CLÉ_DJ branchée"].map((s,i)=>`<div class="step" id="ob${i}"><div class="st"></div>${s}</div>`).join("")}</div>
    <div class="counter mt" id="obC">0</div><div class="hint">sons trouvés</div><div class="prog"><i id="obP"></i></div>
    <button class="btn block mt" id="obB" disabled onclick="onboarding(2)">Continuer</button>${dots}</div>`,true);
  if(step===2)modal(`<div class="onb"><div class="disc" style="animation-duration:2s"></div><h2>C’est prêt${S.name?", "+esc(S.name):""}</h2>
    <div class="grid g2 mt" style="gap:10px;text-align:left">
      <div class="card" style="padding:12px"><div class="big">5 870</div><div class="hint">BPM et tonalités lus depuis Serato</div></div>
      <div class="card" style="padding:12px"><div class="big">344</div><div class="hint">sons analysés en plus</div></div>
      <div class="card" style="padding:12px"><div class="big">8</div><div class="hint">crates proposées, à valider</div></div>
      <div class="card" style="padding:12px"><div class="big">${valQueue().length}</div><div class="hint">sons à vérifier ensemble</div></div></div>
    <p class="hint mt">Chiffres d’exemple. Rien n’a été modifié : tu valides tout.</p>
    <button class="btn block mt" onclick="closeModal();go('home')">Découvrir</button>${dots}</div>`,true);
  if(step===1){let i=0;const tick=()=>{if(!$("#ob0"))return;if(i<3){const s=$("#ob"+i);s.className="step done";s.querySelector(".st").innerHTML="✓";i++;setTimeout(tick,450);}};setTimeout(tick,300);
    let n=0;const target=6214,t=setInterval(()=>{const c=$("#obC");if(!c){clearInterval(t);return;}n=Math.min(target,n+157);c.textContent=n.toLocaleString("fr-FR");$("#obP").style.width=(n/target*100)+"%";if(n>=target){clearInterval(t);$("#obB").disabled=false;}},40);}
}

S.todo=TR.filter(x=>!owned(x)).map(x=>({t:x.t,a:x.a,why:"Tendance"}));
render();onboarding();
</script>
